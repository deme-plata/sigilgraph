<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIGIL OS</title>
<style>
  :root{
    --bg:#07090d; --grid:rgba(120,180,255,.04);
    --panel:#0e1219; --panel2:#141a24; --edge:#1e2836;
    --ink:#dfe7f2; --dim:#8695ab; --faint:#5a6678;
    --cyan:#3ad2ff; --mag:#ff4fd8; --gold:#ffcf5a; --ok:#4be39a; --bad:#ff6b6b;
    font-family:"SF Pro Text",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/34px 34px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/34px 34px,
      radial-gradient(1200px 700px at 78% -10%,rgba(58,210,255,.06),transparent 60%),
      radial-gradient(1000px 700px at 10% 110%,rgba(255,79,216,.05),transparent 60%),
      var(--bg);
    color:var(--ink); overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  .mono{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  /* ===================== BOOT SEQUENCE ===================== */
  #boot{position:fixed; inset:0; z-index:99999; background:#04060a; overflow:hidden;
    font-family:"JetBrains Mono",ui-monospace,monospace; transition:opacity .5s ease}
  #boot::after{ /* scanlines + flicker */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.28) 3px);
    animation:flick 6s infinite steps(60); mix-blend-mode:multiply}
  @keyframes flick{0%,97%{opacity:.5}98%{opacity:.28}100%{opacity:.5}}
  #boot .crt{position:absolute; inset:0; background:radial-gradient(120% 120% at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%); pointer-events:none}
  #boot .mark{position:absolute; top:34px; left:50%; transform:translateX(-50%); text-align:center}
  #boot .glyph{font-size:52px; color:var(--cyan); text-shadow:0 0 18px rgba(58,210,255,.7); animation:pulse 1.4s ease-in-out infinite}
  #boot .mark .name{letter-spacing:6px; color:var(--ink); font-size:15px; margin-top:6px}
  #boot .mark .name b{color:var(--cyan)}
  @keyframes pulse{0%,100%{opacity:.55; transform:scale(.97)}50%{opacity:1; transform:scale(1.03)}}
  #bootlog{position:absolute; left:0; right:0; top:150px; bottom:70px; padding:0 22px; overflow:hidden;
    font-size:12.5px; line-height:1.55; color:#9fb2c9}
  #bootlog .l{white-space:pre-wrap; opacity:0; animation:appear .01s forwards}
  @keyframes appear{to{opacity:1}}
  #bootlog .ts{color:var(--faint)}
  #bootlog .ok{color:var(--ok)} #bootlog .warn{color:var(--gold)} #bootlog .hi{color:var(--cyan)}
  #bootbar{position:absolute; left:22px; right:22px; bottom:40px; height:8px; border:1px solid var(--edge); border-radius:6px; overflow:hidden; background:#0a0f16}
  #bootbar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--mag)); transition:width .3s ease; box-shadow:0 0 12px var(--cyan)}
  #boot .hint{position:absolute; bottom:16px; left:0; right:0; text-align:center; color:var(--faint); font-size:11px}

  /* ===================== TOP BAR ===================== */
  #bar{position:fixed; top:0; left:0; right:0; height:34px; z-index:9000;
    display:flex; align-items:center; gap:14px; padding:0 14px;
    background:linear-gradient(#0b0f16ee,#0b0f16cc); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--edge); font-size:12.5px}
  #bar .logo{font-weight:700; letter-spacing:.5px}
  #bar .logo b{color:var(--cyan)}
  #bar .menu{color:var(--dim); cursor:pointer}
  #bar .menu:hover{color:var(--ink)}
  #bar .spacer{flex:1}
  #bar .stat{color:var(--dim); display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums}
  #bar .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  #bar .dot.ok{background:var(--ok); box-shadow:0 0 8px var(--ok)}
  #bar .dot.bad{background:var(--bad); box-shadow:0 0 8px var(--bad)}
  #clock{color:var(--ink)}

  /* ===================== DESKTOP + WM ===================== */
  #desk{position:fixed; inset:34px 0 78px 0; z-index:10}
  .brand-watermark{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; opacity:.5}
  .brand-watermark .big{font-size:60px; font-weight:800; letter-spacing:2px}
  .brand-watermark .big b{color:var(--cyan)}
  .brand-watermark .sub{color:var(--faint); font-size:13px; margin-top:6px; letter-spacing:3px; text-transform:uppercase}
  .win{position:absolute; min-width:300px; min-height:200px; z-index:100;
    background:linear-gradient(180deg,var(--panel),#0c1017); border:1px solid var(--edge); border-radius:12px;
    box-shadow:0 24px 60px rgba(0,0,0,.6); display:flex; flex-direction:column; overflow:hidden}
  .win.focused{border-color:#31465f; box-shadow:0 26px 70px rgba(0,0,0,.7),0 0 0 1px rgba(58,210,255,.25) inset}
  .win .tb{height:38px; display:flex; align-items:center; gap:8px; padding:0 12px; cursor:grab;
    background:linear-gradient(#121824,#0e131c); border-bottom:1px solid var(--edge)}
  .win .tb:active{cursor:grabbing}
  .lights{display:flex; gap:7px; margin-right:6px}
  .lights i{width:12px;height:12px;border-radius:50%;display:block;cursor:pointer}
  .lights .c{background:#ff5f57} .lights .m{background:#febc2e} .lights .z{background:#28c840}
  .win .tb .t{font-size:12.5px; color:var(--dim); font-weight:600}
  .win .tb .t b{color:var(--ink)}
  .win .body{flex:1; overflow:auto; position:relative}
  .win .rz{position:absolute; width:16px; height:16px; right:0; bottom:0; cursor:nwse-resize; z-index:5}
  /* desktop files + context menu */
  .dfile{position:absolute; width:78px; text-align:center; cursor:pointer; user-select:none; z-index:20}
  .dfile .ic{font-size:34px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
  .dfile .nm{font-size:11px; margin-top:1px; color:var(--ink); background:rgba(10,14,20,.6); border-radius:4px; padding:1px 5px; display:inline-block; max-width:78px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ctxmenu{position:fixed; z-index:12000; background:#0e141d; border:1px solid var(--edge); border-radius:10px; padding:6px; min-width:168px; box-shadow:0 18px 40px rgba(0,0,0,.55); font-size:13px}
  .ctxmenu .mi{padding:8px 12px; border-radius:7px; cursor:pointer; color:var(--ink)}
  .ctxmenu .mi:hover{background:#182130}
  .ctxmenu .sep{height:1px; background:var(--edge); margin:5px 4px}
  .editor{display:flex; flex-direction:column; height:100%; background:#0a0d13}
  .editor textarea{flex:1; background:transparent; border:0; color:var(--ink); font:inherit; font-family:"JetBrains Mono",monospace; font-size:13px; padding:14px; outline:none; resize:none; line-height:1.55}
  .editor .st{padding:6px 14px; border-top:1px solid var(--edge); font-size:11px; color:var(--faint); display:flex; justify-content:space-between}

  /* ===================== DOCK ===================== */
  #dock{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:9000;
    display:flex; gap:12px; padding:10px 14px;
    background:linear-gradient(#0e131cdd,#0b0f16cc); backdrop-filter:blur(12px);
    border:1px solid var(--edge); border-radius:18px; box-shadow:0 18px 40px rgba(0,0,0,.5)}
  .app{width:52px;height:52px;border-radius:14px; display:grid; place-items:center; cursor:pointer;
    background:linear-gradient(160deg,var(--panel2),#0c1119); border:1px solid var(--edge);
    font-size:24px; position:relative; transition:transform .12s ease, border-color .12s}
  .app:hover{transform:translateY(-8px) scale(1.06); border-color:#31465f}
  .app .lbl{position:absolute; top:-30px; left:50%; transform:translateX(-50%);
    background:#0b0f16; border:1px solid var(--edge); border-radius:6px; padding:3px 8px;
    font-size:11px; color:var(--ink); white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s}
  .app:hover .lbl{opacity:1}
  .app .run{position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); width:5px;height:5px;border-radius:50%;background:var(--cyan);opacity:0}
  .app.open .run{opacity:1}

  /* ===================== GENERIC UI ===================== */
  button.btn{font:inherit; font-size:13px; color:#04121a; font-weight:700; cursor:pointer;
    background:linear-gradient(180deg,#5fe0ff,#2bbdf0); border:0; border-radius:9px; padding:9px 16px}
  button.btn:hover{filter:brightness(1.08)}
  button.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--edge); font-weight:600}
  button.btn.ghost:hover{border-color:#31465f; background:#111722}
  button.btn.mag{background:linear-gradient(180deg,#ff7fe4,#ff3fce); color:#1a0416}
  .muted{color:var(--dim)} .faint{color:var(--faint)}
  a{color:var(--cyan)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#1c2734;border-radius:8px;border:2px solid transparent;background-clip:content-box}
  input.search{width:100%; background:#0d1119; border:1px solid var(--edge); color:var(--ink); font:inherit; font-size:13px;
    border-radius:9px; padding:8px 12px; outline:none}
  input.search:focus{border-color:#31465f}

  /* ===================== CLUB ===================== */
  .club{display:flex; flex-direction:column; height:100%; background:radial-gradient(900px 500px at 80% -10%,rgba(255,79,216,.08),transparent 60%),#0a0d13}
  .club .hd{padding:14px 16px; border-bottom:1px solid var(--edge); display:flex; align-items:center; gap:12px}
  .club .hd .title{font-size:16px; font-weight:800; letter-spacing:.5px}
  .club .hd .title b{color:var(--mag)}
  .club .hd .pill{margin-left:auto; font-size:11px; color:var(--dim); border:1px solid var(--edge); padding:4px 10px; border-radius:20px; font-variant-numeric:tabular-nums}
  .club .searchbar{padding:10px 16px; border-bottom:1px solid var(--edge)}
  .stage{flex:1; display:flex; flex-direction:column; min-height:0; background:#05070a}
  .stage video{flex:1; width:100%; min-height:0; background:#000; object-fit:contain}
  .queue{max-height:120px; overflow:auto; border-top:1px solid var(--edge)}
  .qrow{display:flex; align-items:center; gap:10px; padding:8px 16px; cursor:pointer; font-size:12.5px; border-bottom:1px solid #101620}
  .qrow:hover{background:#111722} .qrow.on{background:#141b26; color:var(--cyan)}
  .qrow .i{color:var(--faint)} .qrow.on .i{color:var(--cyan)}
  .controls{display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid var(--edge); background:#0c1017}
  .controls .np{flex:1; min-width:0}
  .controls .np .t{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .controls .np .s{font-size:11px; color:var(--faint)}
  .autobadge{font-size:11px; color:var(--dim); border:1px solid var(--edge); padding:4px 9px; border-radius:20px; cursor:pointer}
  .autobadge.on{color:var(--ok); border-color:#234a3a; background:#0f1a16}
  .gate{padding:26px; display:grid; place-items:center; text-align:center; gap:14px; height:100%}
  .gate .card{max-width:360px; background:linear-gradient(180deg,#11151e,#0c1017); border:1px solid var(--edge); border-radius:16px; padding:24px}
  .gate .price{font-size:34px; font-weight:800; color:var(--gold); margin:8px 0}
  .gate .price small{font-size:14px; color:var(--dim); font-weight:600}
  .gate .lifetime{font-size:12px; color:var(--ok); text-transform:uppercase; letter-spacing:2px}
  .note{font-size:11.5px; color:var(--faint); line-height:1.5}

  /* ===================== NATION ===================== */
  .nation{padding:0; height:100%; display:flex; flex-direction:column; background:radial-gradient(800px 500px at 20% -10%,rgba(255,207,90,.07),transparent 60%),#0a0d13}
  .nation .hd{padding:16px 18px; border-bottom:1px solid var(--edge)}
  .nation .hd .title{font-size:17px; font-weight:800; letter-spacing:.5px}
  .nation .hd .title b{color:var(--gold)}
  .nation .hd .sub{font-size:12px; color:var(--dim); margin-top:3px}
  .nation .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px; overflow:auto}
  .nstat{background:#0f141d; border:1px solid var(--edge); border-radius:12px; padding:14px}
  .nstat .k{font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:1px}
  .nstat .v{font-size:22px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums}
  .nstat .v small{font-size:12px; color:var(--dim); font-weight:600}
  .nstat.wide{grid-column:1/3}
  .nbadge{display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px; border:1px solid var(--edge)}
  .nbadge.on{color:var(--ok); border-color:#234a3a; background:#0f1a16}
  /* commons */
  .ntabs{display:flex; gap:4px; padding:10px 16px 0}
  .ntab{font-size:12.5px; color:var(--dim); padding:7px 14px; border-radius:9px 9px 0 0; cursor:pointer; border:1px solid transparent; border-bottom:none}
  .ntab.on{color:var(--ink); background:#0f141d; border-color:var(--edge)}
  .commons{flex:1; overflow:auto; padding:14px 16px}
  .commons .intro{font-size:12.5px; color:var(--dim); line-height:1.5; margin-bottom:12px}
  .commons .inscbtn{margin-bottom:14px}
  .insc{background:#0f141d; border:1px solid var(--edge); border-radius:12px; padding:14px; margin-bottom:14px}
  .insc select,.insc input,.insc textarea{width:100%; background:#0a0d13; border:1px solid var(--edge); color:var(--ink); font:inherit; font-size:13px; border-radius:8px; padding:8px 10px; margin-top:8px; outline:none; resize:none}
  .insc textarea{min-height:64px; line-height:1.5}
  .insc .hint{font-size:11.5px; color:var(--faint); margin-top:6px}
  .insc .row{display:flex; gap:8px; margin-top:10px}
  .crec{border-left:2px solid var(--edge); padding:8px 0 8px 14px; margin:0 0 14px 4px}
  .crec.k-remembrance{border-color:var(--gold)} .crec.k-gratitude{border-color:var(--ok)}
  .crec.k-trade-bad{border-color:var(--bad)} .crec.k-trade-good{border-color:var(--cyan)}
  .crec.k-vow{border-color:var(--mag)} .crec.k-milestone{border-color:#7bd88f} .crec.k-arrival{border-color:var(--dim)}
  .crec .ct{font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px}
  .crec .cb{font-size:13px; color:#cdd7e6; line-height:1.55; margin-top:4px; white-space:pre-wrap}
  .crec .cm{font-size:11px; color:var(--faint); margin-top:6px; display:flex; gap:10px}
  .crec .cm a{color:var(--faint); cursor:pointer; text-decoration:underline}
  .commons .empty{color:var(--faint); font-size:13px; text-align:center; padding:30px 12px; line-height:1.6}

  /* ===================== MAIL ===================== */
  .mail{display:flex; height:100%; background:#0a0d13}
  .mail .side{width:150px; border-right:1px solid var(--edge); padding:10px; display:flex; flex-direction:column; gap:2px}
  .mail .side .fold{font-size:12.5px; color:var(--dim); padding:8px 10px; border-radius:8px; cursor:pointer; display:flex; justify-content:space-between}
  .mail .side .fold.on{background:#141b26; color:var(--ink)}
  .mail .side .fold .c{font-size:11px; color:var(--faint)}
  .mail .side .compose{margin-top:auto}
  .mail .list{width:240px; border-right:1px solid var(--edge); overflow:auto}
  .mrow{padding:12px 14px; border-bottom:1px solid #121822; cursor:pointer}
  .mrow.on{background:#111722}
  .mrow .f{font-size:12.5px; font-weight:600; display:flex; justify-content:space-between}
  .mrow .f .dt{color:var(--faint); font-weight:400; font-size:11px}
  .mrow .s{font-size:12px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mrow .p{font-size:11px; color:var(--faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mrow .unread{color:var(--cyan)}
  .mail .read{flex:1; display:flex; flex-direction:column; overflow:hidden}
  .mail .read .rh{padding:16px 18px; border-bottom:1px solid var(--edge)}
  .mail .read .rh .subj{font-size:16px; font-weight:700}
  .mail .read .rh .from{font-size:12.5px; color:var(--dim); margin-top:6px}
  .mail .read .rb{padding:18px; overflow:auto; font-size:13.5px; line-height:1.6; color:#cdd7e6; white-space:pre-wrap}
  .mail .empty{flex:1; display:grid; place-items:center; color:var(--faint); font-size:13px}
  .compose-win{display:flex; flex-direction:column; height:100%; background:#0a0d13}
  .compose-win .fld{display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--edge)}
  .compose-win .fld label{width:52px; color:var(--faint); font-size:12px}
  .compose-win input,.compose-win textarea{flex:1; background:transparent; border:0; color:var(--ink); font:inherit; font-size:13.5px; outline:none; resize:none}
  .compose-win textarea{padding:16px; line-height:1.6; height:100%}
  .compose-win .foot{padding:12px 16px; border-top:1px solid var(--edge); display:flex; gap:10px; align-items:center}
  /* ===================== AI CONSOLE ===================== */
  .ai{display:flex; flex-direction:column; height:100%; background:#0a0d13}
  .ai .msgs{flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px}
  .ai .msg{max-width:84%; padding:10px 13px; border-radius:12px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word}
  .ai .msg.u{align-self:flex-end; background:linear-gradient(180deg,#1c93c4,#177aa6); color:#eaf6ff; border-bottom-right-radius:4px}
  .ai .msg.a{align-self:flex-start; background:#141b26; border:1px solid var(--edge); border-bottom-left-radius:4px}
  .ai .msg.a b{color:var(--cyan)}
  .ai .msg.sys{align-self:center; color:var(--faint); font-size:11.5px; background:transparent}
  .ai .card{align-self:flex-start; background:#0f1420; border:1px solid var(--gold); border-radius:12px; padding:12px 14px; font-size:13px; max-width:84%}
  .ai .card .h{color:var(--gold); font-weight:700; margin-bottom:6px}
  .ai .card .row{display:flex; justify-content:space-between; gap:16px; padding:2px 0; font-variant-numeric:tabular-nums}
  .ai .card .row .k{color:var(--dim)}
  .ai .card .btns{margin-top:10px; display:flex; gap:8px}
  .ai .chips{display:flex; gap:6px; flex-wrap:wrap; padding:0 12px 8px}
  .ai .chip{font-size:11.5px; color:var(--dim); border:1px solid var(--edge); border-radius:16px; padding:4px 10px; cursor:pointer}
  .ai .chip:hover{color:var(--ink); border-color:#31465f}
  .ai .aistat{padding:8px 14px; border-bottom:1px solid var(--edge); font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px}
  .ai .aistat a{cursor:pointer; text-decoration:underline}
  .ai .aistat select{background:#0d1119; border:1px solid var(--edge); color:var(--ink); font:inherit; font-size:12px; border-radius:7px; padding:3px 8px; outline:none}
  .ai .aistat .mok{color:var(--ok)}
  .ai .aistat .faint,.ai .faint{color:var(--faint)}
  .ai .msg.tool{align-self:flex-start; font-size:11.5px; color:var(--gold); background:transparent; padding:2px 6px}
  .ai .msg.u.faint{opacity:.6}
  .ai .msg .stats{margin-top:8px; font-size:11px; color:var(--faint)}
  .ai .msg .h{color:var(--cyan); font-weight:700; margin:6px 0 2px}
  .ai .msg .sp{height:6px}
  .ai .msg ul,.ai .msg ol{margin:4px 0 4px 18px; padding:0}
  .ai .msg code{font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; background:#0b1018; border:1px solid var(--edge); border-radius:5px; padding:0 4px}
  .ai .msg pre.code{font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; background:#05080d; border:1px solid var(--edge); border-radius:8px; padding:10px; overflow-x:auto; white-space:pre}
  .ai .mono{font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11.5px; word-break:break-all}
  .ai .aiprog[hidden]{display:none}
  .ai .aiprog{display:flex; align-items:center; gap:10px; padding:4px 14px 6px; font-size:11.5px; color:var(--dim)}
  .ai .aiprog .bar{width:160px; height:6px; border-radius:4px; background:#0d1119; border:1px solid var(--edge); overflow:hidden}
  .ai .aiprog .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),#9f7bff); transition:width .25s}
  .ai .inbar textarea{flex:1; resize:none; background:#0d1119; border:1px solid var(--edge); color:var(--ink); font:inherit; font-size:13.5px; border-radius:10px; padding:10px 14px; outline:none; line-height:1.4; max-height:140px}
  .ai .inbar textarea:focus{border-color:#31465f}
  .ai .inbar{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--edge)}
  .ai .inbar input{flex:1; background:#0d1119; border:1px solid var(--edge); color:var(--ink); font:inherit; font-size:13.5px; border-radius:10px; padding:10px 14px; outline:none}
  .ai .inbar input:focus{border-color:#31465f}

<script>
// sigil-top embedded serve (:9800) proxies /v1/* + /api/* to the node same-origin,
// so from that origin use a RELATIVE base. Bare localhost = a dev box with sigil-api.
const SIGIL_API = (location.hostname==='localhost'||location.hostname==='127.0.0.1')
  ? (location.port==='9800' ? '' : 'http://127.0.0.1:18181') : 'https://sigilgraph.org';
let chainHeight = 0;
function toast(msg, ms=2200){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),ms); }

/* ============================ BOOT SEQUENCE ============================ */
async function boot(){
  const log=document.getElementById('bootlog'), bar=document.querySelector('#bootbar i');
  // fetch live height for a real boot line (honest: a real link to the chain)
  let liveH='...';
  fetch(SIGIL_API+'/v1/mining/challenge',{cache:'no-store'}).then(r=>r.json()).then(j=>{liveH=(j.height||0).toLocaleString();}).catch(()=>{liveH='offline';});
  const seq=[
    ['0.000','SIGIL OS bootloader v0.2  —  target wasm32-wasip1','hi'],
    ['0.014','cpu: WebAssembly linear memory  ·  pages grow-on-demand',''],
    ['0.061','mounting OPFS persistent store at /  ................','ok'],
    ['0.148','wasi_snapshot_preview1: fd, clock, random, poll  .....','ok'],
    ['0.203','verifying module provenance (SQIsign Level 5)  .......','ok'],
    ['0.331','  ◆ echo.wasm   sig ok','ok'],
    ['0.372','  ◆ sh.wasm     sig ok','ok'],
    ['0.418','  ◆ club.wasm   sig ok','ok'],
    ['0.559','fetching /quillonos/manifest.json  ..................','ok'],
    ['0.688','loading init.wasm  →  pid 1','ok'],
    ['0.742','exec sh.wasm  (interactive shell)','ok'],
    ['0.905','linking SIGIL testnet  →  '+SIGIL_API.replace('https://',''),'hi'],
    ['1.050','  chain height @ boot: HEIGHT','hi'],
    ['1.121','deriving session wallet (Ed25519)  .................','ok'],
    ['1.204','BroadcastChannel(\'sigil-os-mesh\')  up','ok'],
    ['1.339','starting window server + dock  ....................','ok'],
    ['1.400','welcome to the Nation.','hi'],
  ];
  let done=false;
  const skip=()=>{ if(done)return; done=true; finish(); };
  window.addEventListener('keydown',skip,{once:true});
  document.getElementById('boot').addEventListener('click',skip,{once:true});
  for(let i=0;i<seq.length;i++){
    if(done) break;
    const [ts,txt,cls]=seq[i];
    const line=document.createElement('div'); line.className='l';
    const body=txt.replace('HEIGHT', liveH);
    line.innerHTML='<span class="ts">[ '+ts+' ]</span> <span class="'+(cls||'')+'">'+body+'</span>';
    log.appendChild(line);
    bar.style.width=Math.round((i+1)/seq.length*100)+'%';
    log.scrollTop=log.scrollHeight;
    await new Promise(r=>setTimeout(r, 60+Math.random()*150));
  }
  if(!done){ done=true; await new Promise(r=>setTimeout(r,420)); finish(); }
}
function finish(){
  const b=document.getElementById('boot');
  b.style.opacity='0';
  setTimeout(()=>{ b.remove();
    document.getElementById('bar').hidden=false;
    document.getElementById('desk').hidden=false;
    document.getElementById('dock').hidden=false;
    startDesktop();
  }, 500);
}

/* ============================ WINDOW MANAGER ============================ */
const desk=()=>document.getElementById('desk');
let z=100, wins={};
function openApp(id,title,w,h,render){
  if(wins[id]){ focusWin(wins[id]); return wins[id]; }
  const d=desk();
  const win=document.createElement('div'); win.className='win'; win.style.width=w+'px'; win.style.height=h+'px';
  win.style.left=Math.max(20,(d.clientWidth-w)/2 + (Object.keys(wins).length*26)%120 - 60)+'px';
  win.style.top =Math.max(14,(d.clientHeight-h)/2 - 20 + (Object.keys(wins).length*22)%90 - 40)+'px';
  win.innerHTML=`<div class="tb"><div class="lights"><i class="c" data-a="close"></i><i class="m"></i><i class="z"></i></div><div class="t">${title}</div></div><div class="body"></div><div class="rz"></div>`;
  d.appendChild(win); wins[id]=win; win._id=id;
  render(win.querySelector('.body'), win);
  dragify(win); resizify(win);
  win.addEventListener('mousedown',()=>focusWin(win));
  win.querySelector('.lights .c').onclick=e=>{e.stopPropagation(); closeWin(id);};
  win.querySelector('.lights .z').onclick=e=>{e.stopPropagation(); zoomWin(win);};
  win.querySelector('.lights .m').onclick=e=>{e.stopPropagation(); win.style.display='none';};
  focusWin(win); markDock(); return win;
}
function focusWin(win){ win.style.zIndex=++z; document.querySelectorAll('.win').forEach(w=>w.classList.remove('focused')); win.classList.add('focused'); win.style.display=''; }
function closeWin(id){ if(wins[id]){ wins[id].remove(); delete wins[id]; markDock(); } }
function zoomWin(win){ const d=desk();
  if(win._max){ Object.assign(win.style,win._max); win._max=null; }
  else{ win._max={left:win.style.left,top:win.style.top,width:win.style.width,height:win.style.height};
    Object.assign(win.style,{left:'12px',top:'8px',width:(d.clientWidth-24)+'px',height:(d.clientHeight-16)+'px'}); } }
function markDock(){ document.querySelectorAll('.app').forEach(a=>a.classList.toggle('open',!!wins[a.dataset.app])); }
function dragify(win){ const tb=win.querySelector('.tb'); let sx,sy,ox,oy,drag=false;
  tb.addEventListener('mousedown',e=>{ if(e.target.closest('.lights'))return; drag=true; sx=e.clientX; sy=e.clientY; ox=parseInt(win.style.left); oy=parseInt(win.style.top); e.preventDefault(); });
  window.addEventListener('mousemove',e=>{ if(!drag)return; win.style.left=(ox+e.clientX-sx)+'px'; win.style.top=Math.max(0,oy+e.clientY-sy)+'px'; });
  window.addEventListener('mouseup',()=>drag=false); }
function resizify(win){ const rz=win.querySelector('.rz'); let sx,sy,ow,oh,rs=false;
  rz.addEventListener('mousedown',e=>{ rs=true; sx=e.clientX; sy=e.clientY; ow=win.offsetWidth; oh=win.offsetHeight; e.preventDefault(); e.stopPropagation(); });
  window.addEventListener('mousemove',e=>{ if(!rs)return; win.style.width=Math.max(300,ow+e.clientX-sx)+'px'; win.style.height=Math.max(200,oh+e.clientY-sy)+'px'; });
  window.addEventListener('mouseup',()=>rs=false); }

/* ============================ NATION (welfare + commons) ============================ */
const COMMONS_KEY='sigil-nation-commons';
const KINDS={
  remembrance:{ic:'🕯️', label:'In memoriam', hint:'someone or something you want the Nation to remember'},
  milestone:  {ic:'🌱', label:'A milestone', hint:'a moment in your life worth marking'},
  'trade-good':{ic:'📈', label:'A good trade', hint:'a trade that went well — and what it taught you'},
  'trade-bad': {ic:'📉', label:'A hard lesson', hint:'a trade that hurt, logged honestly so others learn'},
  gratitude:  {ic:'🙏', label:'Gratitude', hint:'someone who helped you — a person or an agent'},
  vow:        {ic:'🤝', label:'A vow', hint:'a promise you are making, held to account'},
  arrival:    {ic:'📍', label:'I was here', hint:'mark your arrival in the Nation at this block'},
};
function loadCommons(){ try{ return JSON.parse(localStorage.getItem(COMMONS_KEY)||'[]'); }catch(e){ return []; } }
function saveCommons(a){ try{ localStorage.setItem(COMMONS_KEY, JSON.stringify(a)); }catch(e){} }
let nationTab='welfare';
function renderNation(body, presetKind){
  if(presetKind){ nationTab='commons'; }

function paintWelfare(panel){

    const d=j.data||{}; const g=panel.querySelector('#ngrid'); if(!g)return;

    const stipendUsd=(Number(d.stipend_usd_e8||0)/1e8).toFixed(2);
    g.innerHTML=`
      <div class="nstat"><div class="k">Status</div><div class="v"><span class="nbadge ${d.active?'on':''}">${d.active?'● active':'inactive'}</span></div></div>
      <div class="nstat"><div class="k">Since height</div><div class="v">${(d.activation_height||0).toLocaleString()}</div></div>

  }).catch(err=>{ console.error('nation:',err); const g=panel.querySelector('#ngrid'); if(g) g.innerHTML='<div style="grid-column:1/3;color:var(--bad);font-size:13px;padding:20px">nation status unavailable — '+(err&&err.message||err)+'</div>'; });

function paintCommons(panel, presetKind){
  const recs=loadCommons();
  panel.innerHTML=`<div class="commons">
    <div class="intro">The commons remembers <i>for</i> its people, not just <i>about</i> them. Inscribe what mattered — a person, a lesson, a promise. Each is stamped at the current block and kept here. No fee; this is not a transaction.</div>
    <button class="btn inscbtn" id="inscbtn">＋ Inscribe</button>
    <div id="inscform"></div>
    <div id="creclist"></div>
  </div>`;
  const list=panel.querySelector('#creclist');
  const paintList=()=>{ const rs=loadCommons();
    if(!rs.length){ list.innerHTML='<div class="empty">The book is empty.<br>Be the first to mark something the Nation should remember.</div>'; return; }
    list.innerHTML=''; rs.slice().reverse().forEach(r=>{ const k=KINDS[r.kind]||{ic:'•',label:r.kind};
      const el=document.createElement('div'); el.className='crec k-'+r.kind;
      el.innerHTML='<div class="ct">'+k.ic+' '+esc(r.title||k.label)+'</div>'+(r.body?'<div class="cb">'+esc(r.body)+'</div>':'')+
        '<div class="cm"><span>'+k.label+'</span><span>'+esc(r.date)+'</span><span>block '+(r.height||'—').toLocaleString()+'</span><a data-id="'+r.id+'">remove</a></div>';
      el.querySelector('a').onclick=()=>{ if(confirm('Remove this inscription?')){ saveCommons(loadCommons().filter(x=>x.id!==r.id)); paintList(); } };
      list.appendChild(el); }); };
  const showForm=(kind)=>{ const f=panel.querySelector('#inscform');
    f.innerHTML=`<div class="insc">
      <select id="ik">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${k===kind?'selected':''}>${v.ic} ${v.label}</option>`).join('')}</select>
      <input id="it" placeholder="a title — a name, a few words" maxlength="80">
      <textarea id="ib" placeholder="say what you want held here"></textarea>
      <div class="hint" id="ihint"></div>
      <div class="row"><button class="btn" id="isave">Inscribe</button><button class="btn ghost" id="icancel">Cancel</button></div>
    </div>`;
    const sel=f.querySelector('#ik'); const hint=f.querySelector('#ihint');
    const setHint=()=>hint.textContent=(KINDS[sel.value]||{}).hint||''; sel.onchange=setHint; setHint();
    f.querySelector('#icancel').onclick=()=>{ f.innerHTML=''; };
    f.querySelector('#isave').onclick=()=>{
      const title=f.querySelector('#it').value.trim(), bdy=f.querySelector('#ib').value.trim();
      if(!title && !bdy){ f.querySelector('#it').focus(); return; }
      const recs2=loadCommons();
      recs2.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,5), kind:sel.value, title, body:bdy,
        date:new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}), height:chainHeight||0});
      saveCommons(recs2); f.innerHTML=''; paintList();
      toast(sel.value==='remembrance'?'Held in the commons. 🕯️':'Inscribed in the commons.');
    };
    f.querySelector(kind==='remembrance'?'#ib':'#it').focus();
  };
  panel.querySelector('#inscbtn').onclick=()=>showForm(presetKind||'remembrance');
  if(presetKind) showForm(presetKind);
  paintList();
}

// Minimal SAFE markdown: escape first, then a few inline/block forms. Never injects raw HTML.
function aiMd(src){
  const parts=String(src).split('```'); let out='';
  parts.forEach((p,i)=>{
    if(i%2===1){ out+='<pre class="code">'+esc(p.replace(/^[a-z0-9_-]*\n/i,''))+'</pre>'; return; }
    const lines=esc(p).split('\n'); let html='', inList='';
    const close=()=>{ if(inList){ html+='</'+inList+'>'; inList=''; } };
    lines.forEach(l=>{
      let m;
      if((m=l.match(/^\s*#{1,4}\s+(.*)$/))){ close(); html+='<div class="h">'+m[1]+'</div>'; return; }
      if((m=l.match(/^\s*[-*•]\s+(.*)$/))){ if(inList!=='ul'){ close(); html+='<ul>'; inList='ul'; } html+='<li>'+m[1]+'</li>'; return; }
      if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ if(inList!=='ol'){ close(); html+='<ol>'; inList='ol'; } html+='<li>'+m[1]+'</li>'; return; }
      close(); html+= l.trim()==='' ? '<div class="sp"></div>' : '<div>'+l+'</div>';
    });
    close();
    html=html.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
    out+=html;
  });
  return out;
}

// gate sigil-top uses (sigil-veil-wasm). A loopback endpoint never loads it: nothing leaves.
// Off-device: recovery phrases / labelled keys are REFUSED; addresses, e-mails, tokens, IPs
// and paths leave as placeholders and are restored here; every send is kept in localStorage
// 'veil-egress' ("what did my AI send out?"). If the gate cannot load, nothing is sent off-device.
let __veilMod=null, __veil=null;
function veilIsLocalJS(u){ try{ const h=new URL(u).hostname.toLowerCase(); return h==='localhost'||h.endsWith('.localhost')||h==='[::1]'||h==='::1'||h.startsWith('127.'); }catch(e){ return false; } }
function veilErr(msg){ const e=new Error(msg); e.veil=true; return e; }
async function veilOutbound(messages){
  if(veilIsLocalJS(OLLAMA)) return {messages:messages, veil:null};

  catch(e){ throw veilErr('🕶 Veil (the privacy gate) could not load, so nothing was sent to the off-device model at '+OLLAMA+'. Use a model on this device, or reload the page.'); }
  if(__veilMod.veil_is_loopback(OLLAMA)) return {messages:messages, veil:null};
  if(!__veil) __veil=new __veilMod.Veil();

    if(m.role==='system'){ out.push(Object.assign({},m,{content:__veil.pseudonymize(m.content)})); continue; }

function veilDeep(v,o){ if(typeof o==='string') return v.rehydrate(o); if(Array.isArray(o)) return o.map(x=>veilDeep(v,x)); if(o&&typeof o==='object'){ const r={}; for(const k in o) r[k]=veilDeep(v,o[k]); return r; } return o; }
// One streamed turn. onEv({thinking|token|tools|done}). Resolves with {content,tool_calls,done}.
async function aiStream(messages,tools,onEv,signal){
  const vo=await veilOutbound(messages), veil=vo.veil; messages=vo.messages;
  const body={model:ollamaModel,stream:true,messages:messages,options:{num_ctx:8192}};
  if(tools) body.tools=tools;

  if(!r.ok) throw new Error('model '+r.status+' '+(await r.text()).slice(0,160));

      if(m.content){ const t= veil? veil.push(m.content) : m.content; if(t){ content+=t; onEv({token:t}); } }
      if(m.tool_calls&&m.tool_calls.length) calls=calls.concat(veil? veilDeep(veil,m.tool_calls) : m.tool_calls);

/* ============================ TERMINAL — flux-aether ============================
   A real shell against the node's aether artifact store (/v1/aether/*).

   Aether is NOT a POSIX filesystem and this terminal deliberately does not
   pretend otherwise: there is no cd, no mkdir, no rm, no rename. What exists is
   a name -> (version, content-hash) map plus a content-addressed blob store.
   `put` hashes your bytes, erasure-codes and encrypts them into shards, and
   authors a signed version entry naming that hash. The name is a label; the
   hash is the truth.

   Every command below is one HTTP call to the node. Nothing is simulated —
   if the node is unreachable the command says so instead of inventing output.
   ============================================================================ */
const TERM_HELP = [
  ['help',            'this list'],
  ['root',            "the store's identity, manifest root and real limits"],
  ['ls',              'every named artifact this node holds'],
  ['put <name> <…>',  'write text into aether; prints the content address'],
  ['cat <name>',      'read the bytes behind a name'],
  ['stat <name>',     'version entry, signature, shard status'],
  ['recover <name>',  'rebuild from a SHORT shard set — proves the erasure coding'],
  ['clear',           'clear the screen'],
];

let termHist = [], termHistIx = 0;

function renderTerminal(body){
  body.innerHTML = `<div class="term">
    <div class="term-out" id="tout"></div>
    <div class="term-in">
      <span class="term-ps1">aether ›</span>
      <input id="tin" autocomplete="off" spellcheck="false" placeholder="type help and press Enter">
    </div>
  </div>`;
  const out = body.querySelector('#tout'), inp = body.querySelector('#tin');

  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const line = (html, cls) => {
    const d = document.createElement('div');
    d.className = 'tl' + (cls ? ' ' + cls : '');
    d.innerHTML = html;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
    return d;
  };
  const kv = (k, v, cls) => line(`<span class="tk">${esc(k)}</span><span class="tv ${cls||''}">${esc(v)}</span>`);

  // Banner. States what this is and — importantly — what it is not.
  line(`<b>SIGIL aether</b> — the node's artifact store`, 'tb');
  line(`Content-addressed and versioned, not a POSIX filesystem: no cd, no rm, no rename.`, 'td');
  line(`A write authors a signed version entry naming the BLAKE3 of your bytes.`, 'td');
  line(`<b>help</b> lists the commands.`, 'td');
  line('');

  async function api(path, init){
    const r = await fetch(SIGIL_API + path, Object.assign({cache:'no-store'}, init||{}));
    const ct = r.headers.get('content-type') || '';
    // A 200 with text/html is the SPA fallback — it means the route is ABSENT,
    // not that it answered. Saying "route not found" beats a JSON parse error.
    if (!ct.includes('application/json')) {
      throw new Error(`the node answered HTTP ${r.status} with ${ct.split(';')[0]||'no content-type'} — /v1/aether is not on this host`);
    }
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'the node refused it, without saying why');
    return j.data;
  }

  const CMD = {
    async help(){
      line('commands', 'tb');
      TERM_HELP.forEach(([c, d]) => line(`  <span class="tc">${esc(c)}</span> <span class="td">${esc(d)}</span>`));
      line('');
      line('  names use a-z 0-9 . _ - / — e.g. <span class="tc">user/notes/hello</span>', 'td');
      line('  try: <span class="tc">put user/notes/hello it worked</span> then <span class="tc">ls</span>', 'td');
    },

    async root(){
      const d = await api('/v1/aether/root');
      kv('node id', d.node_id);
      kv('manifest root', d.manifest_root || '(empty store)');
      kv('entries', `${d.entries} / ${d.max_entries}`);
      kv('store', `${(d.store_bytes/1024).toFixed(1)} KiB / ${(d.max_store_bytes/1048576)|0} MiB`);
      kv('max per write', `${(d.max_content_bytes/1024)|0} KiB`);
      kv('writes', d.writable ? 'accepted' : 'DISABLED on this node', d.writable ? 'tg' : 'tr');
      // Both of these are the node telling on itself. Show them plainly.
      kv('signatures', d.sig_kind + '  (keyed hash — authenticates the entry to its author, not to you)', 'tw');
      kv('gossip', d.gossip + '  (a write lands on THIS node; peer convergence is not wired yet)', 'tw');
    },

    async ls(){
      const d = await api('/v1/aether/ls');
      if (!d.entries.length){ line('the store is empty — write something with <span class="tc">put</span>', 'td'); return; }
      line(`<span class="tk">${'name'.padEnd(30)}</span><span class="tk">${'ver'.padEnd(9)}</span><span class="tk">content address</span>`, 'tb');
      d.entries.forEach(e => line(
        `<span class="tn">${esc(e.name.padEnd(30))}</span><span class="td">${esc(e.version.padEnd(9))}</span><span class="th">${esc(e.content_hash.slice(0,16))}…</span>`
      ));
      line('');
      kv('manifest root', d.manifest_root);
      kv('entries', String(d.entries.length));
    },

    async put(args){
      const name = args[0];
      const text = args.slice(1).join(' ');
      if (!name || !text) throw new Error('usage: put <name> <text…>');
      const d = await api('/v1/aether/put', {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({name, content: text}),
      });
      line(`wrote <b>${esc(d.name)}</b> ${esc(d.version)}`, 'tg');
      kv('content address', d.content_hash);
      kv('shard merkle root', d.shard_merkle_root);
      kv('shards', `${d.shards}  (${d.bytes} bytes, erasure-coded + encrypted)`);
      if (d.deduplicated) kv('note', 'these exact bytes were already stored — same address, no new disk', 'tw');
      kv('manifest root', `${d.manifest_root}  (${d.manifest_entries} entries)`);
      line(`the name is a label; <span class="th">${esc(d.content_hash.slice(0,16))}…</span> is what it resolves to`, 'td');
    },

    async cat(args){
      if (!args[0]) throw new Error('usage: cat <name>');
      const d = await api('/v1/aether/cat?name=' + encodeURIComponent(args[0]));
      if (d.text != null) String(d.text).split('\n').forEach(l => line(esc(l) || '&nbsp;'));
      else line(`(${d.bytes} bytes, not text) base64: ${esc(String(d.base64).slice(0,120))}…`, 'td');
      line('');
      kv('read via', d.read_via === 'shards' ? 'shards (RS-reassembled)' : 'blob');
      kv('re-hashes to its address', d.verified ? 'yes — server-computed' : 'NO', d.verified ? 'tg' : 'tr');
      if (d.verified) line('for a check you can watch happen, use <span class="tc">recover</span>', 'td');
    },

    async stat(args){
      if (!args[0]) throw new Error('usage: stat <name>');
      const d = await api('/v1/aether/stat?name=' + encodeURIComponent(args[0]));
      kv('name', d.entry.name);
      kv('version', d.entry.version);
      kv('content address', d.entry.content_hash);
      kv('producer', d.entry.producer);
      kv('authored', new Date(d.entry.ts * 1000).toISOString().replace('T',' ').slice(0,19) + ' UTC');
      kv('fingerprint', d.fingerprint);
      kv('signature', `${d.sig.slice(0,32)}…  [${d.sig_kind}]`);
      kv('shards on disk', String(d.shards_on_disk));
      kv('plaintext blob', d.blob_present ? 'present' : 'absent — reads go through the shards', d.blob_present ? '' : 'tw');
    },

    async recover(args){
      if (!args[0]) throw new Error('usage: recover <name>');
      line('withholding one data shard and rebuilding from the rest…', 'td');
      const d = await api('/v1/aether/recover?name=' + encodeURIComponent(args[0]));
      kv('erasure layout', `${d.k} data + parity = ${d.n} shards`);
      kv('shards withheld', `#${d.withheld_index} — handed ${d.shards_used} of ${d.shards_total} to the reassembler`);
      kv('bytes rebuilt', String(d.bytes_recovered));
      kv('address', d.content_hash);
      if (d.rehash_matches){
        line(`RECOVERED — the rebuilt bytes re-hash to the original address.`, 'tg');
        line(`One shard was missing and the content came back anyway. That is the erasure`, 'td');
        line(`coding doing its job, and it is the same code path the chain snapshot uses.`, 'td');
      } else {
        line(`FAILED — rebuilt bytes do NOT match the address. Report this.`, 'tr');
      }
    },

    async clear(){ out.innerHTML = ''; },
  };

  async function exec(raw){
    const s = raw.trim();
    if (!s) return;
    line(`<span class="term-ps1">aether ›</span> ${esc(s)}`, 'tp');
    const parts = s.split(/\s+/), cmd = parts[0].toLowerCase(), args = parts.slice(1);
    const fn = CMD[cmd];
    if (!fn){ line(`no such command: ${esc(cmd)} — try <span class="tc">help</span>`, 'tr'); return; }
    try { await fn(args); }
    catch (e) { line(esc(e.message || String(e)), 'tr'); }
    line('');
  }

  inp.addEventListener('keydown', async e => {
    if (e.key === 'Enter'){
      const v = inp.value;
      if (v.trim()){ termHist.push(v); termHistIx = termHist.length; }
      inp.value = '';
      await exec(v);
    } else if (e.key === 'ArrowUp'){
      e.preventDefault();
      if (termHistIx > 0) inp.value = termHist[--termHistIx] || '';
    } else if (e.key === 'ArrowDown'){
      e.preventDefault();
      if (termHistIx < termHist.length - 1) inp.value = termHist[++termHistIx] || '';
      else { termHistIx = termHist.length; inp.value = ''; }
    }
  });
  setTimeout(() => inp.focus(), 60);
}
