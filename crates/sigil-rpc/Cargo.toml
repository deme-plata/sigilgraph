[package]
name = "sigil-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SIGIL node RPC core — chokepoint-respecting swap (exchange of money) + mining-reward submission over sigil-state + sigil-dex. The keystone both AGORA-exchange and mining depend on. FLUXFOOD-light."

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
blake3     = { workspace = true }
thiserror  = { workspace = true }
hex        = { workspace = true }

sigil-state = { path = "../sigil-state" }
sigil-dex   = { path = "../sigil-dex" }
sigil-bank  = { path = "../sigil-bank" }
sigil-oauth = { path = "../sigil-oauth" }
# T6: /mandate/create + /mandate/close build a real SigilTx::MandateCreate/
# MandateClose and apply it through the same apply_tx/commit_state_transition
# chokepoint every other tx uses, instead of writing the local book directly.
sigil-tx    = { path = "../sigil-tx" }
# University credential economy: the money-bridge module wires its pure spine
# (award verify → points → settle → graduate) to the state chokepoint.
sigil-university = { path = "../sigil-university" }
sigil-emission = { path = "../sigil-emission" } # halving block-reward schedule (→21M)
sigil-header = { path = "../sigil-header" } # ONE-CHAIN P1: real SigilBlockHeaderV0 per ledger block
# WS2 proof-carrying /balance verifier: the TipProofFlavor::adversary_resistant()
# gate that refuses a balance proof under the insecure Blake3Fingerprint flavor.
sigil-tip-proof = { path = "../sigil-tip-proof", default-features = false }

# Dual-lane mining gate for the sigil-rpcd /api/v1/mining/{challenge,submit}
# endpoints. default-features = false keeps the keystone reqwest/market-free —
# we use ONLY the verification core (Challenge/Submission/check_submission).
flux-vdf   = { workspace = true }
flux-miner = { path = "../flux-miner", default-features = false }
# flux-native explorer backend: flux-db (durable LSM) + flux-search (TF-IDF) via
# flux-history — every tx is appended as a searchable HistoryEntry; /search queries it.
flux-history = { path = "../../../flux/crates/flux-history" }
# state persistence: snapshot the money+chain to flux-db (bincode for u128/tuple-key maps).
flux-db = { path = "../../../flux/crates/flux-db" }
bincode = "1"
