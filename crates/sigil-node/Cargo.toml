[package]
name = "sigil-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SIGIL node — main binary. Phase 0: integration shell over Track C (header + state + events), in-memory chain tracker, CLI to mint genesis and show tip. Real networking comes from flux-sigil-net (Track B) and consensus from flux-narwhal-core / flux-dagknight (Track A) in P2."

[[bin]]
name = "sigil-node"
path = "src/main.rs"

[features]
# Pull real Arti Tor up through sigil-net → sigil-net-tor. Heavy (117 crates);
# build with `--features arti` only when an operator actually wants Tor egress
# (SIGIL_TRANSPORT=tor or wg+tor).
arti = ["sigil-net/arti"]

[dependencies]
flux-sqisign = { path = "../../../flux/crates/flux-sqisign" }
serde      = { workspace = true }
serde_json = { workspace = true }
blake3     = { workspace = true }
hex        = { workspace = true }
# chronos_send_throughput.rs: signs real SendBridge submissions with real
# ed25519 keypairs (deterministic seeds — no rand_core feature needed here).
ed25519-dalek = { version = "2.2" }
anyhow     = { workspace = true }
tokio      = { workspace = true }
# 2026-08-20: RUST_LOG was inert for this binary — no subscriber was ever installed,
# so every tracing::{info,debug,warn}! call in dependencies (flux-p2p's gossipsub
# mesh/graft/prune diagnostics included) was silently dropped regardless of the env
# var, on every node including Epsilon. Wired up in main() to actually see it.
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bincode    = "1"
# v0.33 zstd wire (encode side): codec=1 backfill replies as 'Z'+zstd-1. Measured 14.0×
# on real header chunks. Server is linux-only, so the C-backed zstd crate is fine here
# (the Windows-cross client decodes with pure-Rust ruzstd).
zstd       = "0.13"
rmp-serde  = "1"   # MessagePack — compact AND self-describing, so it round-trips
                   # SIGIL's internally-tagged enums (SigilEvent/SigilTx tag="kind")
                   # that bincode cannot decode. The store codec.
lz4        = "1"

sigil-header  = { path = "../sigil-header" }
sigil-handshake = { path = "../sigil-handshake" } # H2 verify-before-sync
sigil-shield = { path = "../sigil-shield" }
sigil-state   = { path = "../sigil-state" }
sigil-emission = { path = "../sigil-emission" } # ONE-CHAIN step 1: block reward for braid coinbase
sigil-bank    = { path = "../sigil-bank" } # pool-share coinbase: master/commons dev-fee split
flux-vdf      = { workspace = true } # test-only: constructing AcceptedSolve for the mint_next_block integration test
sigil-api = { path = "../sigil-api" }
sigil-events  = { path = "../sigil-events" }
sigil-net       = { path = "../sigil-net" }
sigil-net-wg    = { path = "../sigil-net-wg" }
sigil-updater   = { path = "../sigil-updater" }
sigil-tx        = { path = "../sigil-tx" }
sigil-tip-proof = { path = "../sigil-tip-proof" }
# SIGIL_BRAIDPOOL_v1_1.md Phase B: the ONE mempool handle this node and
# sigil-api's money API both hold (see sigil-narwhal-mempool::MempoolBackend's
# doc comment for the correctness hazard this closes).
sigil-narwhal-mempool = { path = "../sigil-narwhal-mempool" }
# Dandelion++ tx-gossip privacy relay — see dandelion_relay.rs for the wiring.
sigil-dandelion = { path = "../sigil-dandelion" }
rand            = { workspace = true }
# SIGIL_DAG=1 real ordering: deterministic braid linearization (NOT GHOSTDAG,
# NOT DagKnight-the-paper — docs/SIGIL_DAGKNIGHT_LANE_v0.md §1).
sigil-dagknight = { workspace = true }
flux-topology = { path = "../flux-topology" }
flux-p2p      = { workspace = true }
# our own file system: Reed-Solomon erasure + encryption. Wired here for
# durable chain persistence — aether-load-on-boot (can't-lose).
flux-aether   = { path = "../../../flux/crates/flux-aether" }
# the (Vizily-ported) search engine — persistent index, TF-IDF/BM25, PageRank,
# semantic embeddings. Makes a chronos-produced chain searchable.
flux-search   = { path = "../../../flux/crates/flux-search" }
# embedded LSM-tree, RocksDB-style block-SSTs with per-block LZ4. The real
# durable graph store (replaces the JSON-snapshot path). See store.rs.
flux-db       = { path = "../../../flux/crates/flux-db" }
# deterministic block production for the footprint simulation (chronos_sim bin)
sigil-chronos = { path = "../sigil-chronos" }
flux-chronos  = { path = "../../../flux/crates/flux-chronos" }

[dev-dependencies]
