    <style>
:root{--bg-primary:#0a0e1a;--bg-secondary:#111827;--bg-card:#1a1f35;--bg-input:#0f1322;--border-color:#2a3050;--border-focus:#c8a84e;--text-primary:#e8eaf0;--text-secondary:#8b92a8;--text-muted:#4a5070;--accent-gold:#c8a84e;--accent-gold-hover:#dbb95f;--accent-cyan:#00d4aa;--accent-violet:#9580ff;--glow-gold:rgba(200,168,78,0.15);--font-sans:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:linear-gradient(135deg,#0a0e1a 0%,#111827 50%,#0f1629 100%);color:var(--text-primary);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:36px 32px;max-width:440px;width:100%;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(135deg,#c8a84e,#dbb95f,#c8a84e);border-radius:14px 14px 0 0}
.brand{text-align:center;margin-bottom:24px}
.brand h1{font-size:24px;font-weight:700;background:linear-gradient(135deg,#c8a84e,#dbb95f,#c8a84e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand p{font-size:12px;color:var(--text-secondary);margin-top:4px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.form-group input{width:100%;padding:12px 14px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:10px;color:var(--text-primary);font-size:14px;font-family:var(--font-sans);outline:none;transition:all .2s}
.form-group input:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px var(--glow-gold)}
.btn{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#c8a84e,#dbb95f,#c8a84e);color:#0a0e1a;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font-sans)}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(200,168,78,0.2)}
.footer{text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted)}
.footer a{color:var(--accent-gold);text-decoration:none}
.status{margin-top:14px;padding:8px 12px;border-radius:8px;background:rgba(0,212,170,0.05);border:1px solid rgba(0,212,170,0.1);text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--accent-cyan)}
/* ── chain search bar (explore the chain from the gate) ── */
.topsearch{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;width:min(560px,92vw);display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:13px;cursor:text;background:linear-gradient(180deg,rgba(0,212,170,.06),rgba(149,128,255,.06));border:1px solid var(--border-color);transition:.2s}
.topsearch::before{content:'';position:absolute;inset:-1px;border-radius:13px;padding:1px;background:linear-gradient(120deg,var(--accent-cyan),var(--accent-violet),var(--accent-gold));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.2s;pointer-events:none}
.topsearch:focus-within{border-color:transparent;box-shadow:0 0 24px rgba(0,212,170,.22)}
.topsearch:focus-within::before{opacity:1;animation:tshue 3s linear infinite}
@keyframes tshue{to{filter:hue-rotate(360deg)}}
.topsearch .ts-ico{color:var(--accent-cyan);font-size:15px;flex:none}
.topsearch input{flex:1;background:transparent;border:0;outline:none;color:var(--text-primary);font-family:var(--font-mono);font-size:13px}
.topsearch input::placeholder{color:var(--text-muted)}
.topsearch kbd{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);background:rgba(255,255,255,.05);border:1px solid var(--border-color);border-radius:6px;padding:2px 7px}
.wdrop{position:absolute;top:calc(100% + 7px);left:0;right:0;background:rgba(15,19,34,.98);backdrop-filter:blur(20px);border:1px solid var(--border-color);border-radius:13px;max-height:340px;overflow-y:auto;z-index:60;box-shadow:0 22px 64px rgba(0,0,0,.6);display:none;padding:6px}
.wdrop .wr{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.12s}
.wdrop .wr:hover{background:rgba(0,212,170,.08)}
.wdrop .wr .wt{font-family:var(--font-mono);font-weight:600;font-size:12px;color:var(--text-primary);min-width:116px}
.wdrop .wr .wd{flex:1;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdrop .wr .wty{font-size:8px;font-family:var(--font-mono);padding:2px 7px;border-radius:999px;text-transform:uppercase}
.wdrop .wr .wty.live{background:rgba(0,212,170,.14);color:var(--accent-cyan)}.wdrop .wr .wty.flux{background:rgba(149,128,255,.14);color:var(--accent-violet)}
.wdrop .wfoot{padding:9px 12px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);border-top:1px solid var(--border-color);text-align:center}
    </style>

      <span class="ts-ico">⬡</span>

      <kbd>/</kbd>
      <div class="wdrop" id="wdrop"></div>
    </div>
    <div class="card">
      <div class="brand">

        </div>
        <button type="submit" class="btn">◈ Enter Sigilgraph</button>
      </form>
      <div class="footer">
        <p>New? <a href="#" onclick="generateMnemonic()">Generate a mnemonic</a></p>
        <p style="margin-top:8px"><a href="#" id="mmCreateBtn" onclick="createWalletMetaMask();return false">🦊 Create a wallet with MetaMask</a></p>
        <div id="mmStat" style="margin-top:8px;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;color:#6df3ff;word-break:break-word"></div>
        <div id="mnemonic" style="margin-top:10px;font-family:var(--font-mono);font-size:13px;color:var(--accent-gold);word-break:break-word"></div>
      </div>
      <div class="status">● sigilgraph H 0.8.1 · flux v0.26.0 · SSL valid</div>

    <!-- sigil-metamask.js inlined: sigil-top serves only surfaces compiled
         into the binary, so an external script-src would 404 on :9800. -->
    <script>
/* ──────────────────────────────────────────────────────────────────────────
   sigil-metamask.js — SIGILGRAPH ⇄ MetaMask / Polygon integration.
   2026-08-26. Plain classic script (no bundler, no ESM, no CDN): defines
   window.SigilMM. Loaded by enter-sigil.html (create-wallet-with-MetaMask)
   and sigil-wallet-tron.html (connect button + cross-chain bridge modal).

   ── Everything here was verified against the LIVE deployment, not assumed ──

   Wrapped-SIGIL ERC-20, Polygon mainnet (chain 137):
     0xc224602C32F5c7f68d3Ef002aE4C99e4C7Df25B7
   Verified live 2026-08-26 by eth_call against polygon-bor-rpc.publicnode.com:
     symbol()   -> "SIGIL"
     decimals() -> 18        (0x12)

   The RETURN leg (Polygon -> native SIGIL) calls, on that contract:
     burn(uint256 amount, bytes32 destSigilAddress)   selector 0xbcf64e05
   Confirmed by fetching the deployed runtime bytecode via eth_getCode and
   matching function selectors: `burn(uint256,bytes32)` (0xbcf64e05) IS
   present; the reversed-argument `burn(bytes32,uint256)` (0x7a408454) and
   `burn(uint256,address)` (0xfcd3533c) are BOTH absent — so the argument
   order below is not a guess. The BurnedTo topic hash
   (0x95d8284568...c9b79785) is likewise present in the bytecode, i.e. the
   function really does emit the event the relayer watches for. The keccak
   used to derive those selectors was self-tested against the canonical
   ERC-20 Transfer topic hash first.

   That event is consumed by crates/sigil-relayer (systemd:
   sigil-bridge-relayer.service, confirmed ACTIVE 2026-08-26), which decodes
     event BurnedTo(address indexed from, uint256 amount, bytes32 indexed destSigilAddress)
   and submits a relayer-signed POST /v1/bridge/unlock to sigil-api, releasing
   native SIGIL from the bridge vault. Burns are deduped by tx hash in the
   node's `processed_burns` set, so the same burn can never unlock twice.

   Decimals: native SIGIL is 8dp, wrapped SIGIL is 18dp, so the bridge's one
   conversion factor is 10^10 (sigil-relayer::DECIMAL_SHIFT). The relayer
   FLOORS any burn that is not a clean multiple of 10^10 and that dust is
   unrecoverable — so every amount this file sends is forced to a clean
   multiple by capping input at 8 decimal places. Never relax that.

   Polygon's native gas token is POL (renamed from MATIC); wallet_addEthereumChain
   below uses POL deliberately.
   ────────────────────────────────────────────────────────────────────────── */
(function (root) {
  'use strict';

  var POLYGON_PARAMS = {
    chainId: '0x89',                       // 137
    chainName: 'Polygon Mainnet',
    nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 },
    rpcUrls: ['https://polygon-rpc.com', 'https://polygon-bor-rpc.publicnode.com'],
    blockExplorerUrls: ['https://polygonscan.com']
  };

  var TOKEN = {
    address: '0xc224602C32F5c7f68d3Ef002aE4C99e4C7Df25B7',
    symbol: 'SIGIL',
    decimals: 18
  };

  // Read-only fallbacks, same order/endpoints as sigil-api's Chain::Polygon
  // public_fallbacks() — used when no injected wallet is present so the
  // balance card still works for a logged-out visitor.
  var PUBLIC_RPCS = ['https://polygon-bor-rpc.publicnode.com', 'https://1rpc.io/matic'];

  var SEL_BURN      = '0xbcf64e05'; // burn(uint256,bytes32)
  var SEL_BALANCEOF = '0x70a08231'; // balanceOf(address)

  var DECIMAL_SHIFT = 10000000000n; // 10^10 — native 8dp -> wrapped 18dp

  // ── provider discovery: EIP-6963 first (MetaMask's own recommendation),
  // legacy window.ethereum as fallback. Pre-6963 the LAST extension to inject
  // won window.ethereum, so with several wallets installed you could silently
  // drive the wrong one; 6963 makes each announce itself instead.
  var providers = [];   // [{info:{uuid,name,rdns,icon}, provider}]
  var announced = {};

  function onAnnounce(ev) {
    try {
      var d = ev.detail; if (!d || !d.provider || !d.info) return;
      var key = d.info.uuid || d.info.rdns || d.info.name;
      if (announced[key]) return;
      announced[key] = true;
      providers.push({ info: d.info, provider: d.provider });
    } catch (e) { /* a malformed announce must never break the page */ }
  }

  if (root.addEventListener) {
    root.addEventListener('eip6963:announceProvider', onAnnounce);
    try { root.dispatchEvent(new Event('eip6963:requestProvider')); } catch (e) {}
  }

  function legacyProviders() {
    var out = [], eth = root.ethereum;
    if (!eth) return out;
    if (Array.isArray(eth.providers)) {
      eth.providers.forEach(function (p) {
        out.push({ info: { name: p.isMetaMask ? 'MetaMask' : 'Injected wallet', rdns: 'legacy', uuid: 'legacy-' + out.length }, provider: p });
      });
    } else {
      out.push({ info: { name: eth.isMetaMask ? 'MetaMask' : 'Injected wallet', rdns: 'legacy', uuid: 'legacy-0' }, provider: eth });
    }
    return out;
  }

  function list() {
    // Re-request each time: extensions can announce late (slow startup, or the
    // user installs/enables one while the page is open).
    try { root.dispatchEvent(new Event('eip6963:requestProvider')); } catch (e) {}
    if (providers.length) return providers.slice();
    return legacyProviders();
  }

  function pick() {
    var all = list();
    if (!all.length) return null;
    for (var i = 0; i < all.length; i++) {
      var n = (all[i].info.rdns || '') + ' ' + (all[i].info.name || '');
      if (/metamask/i.test(n)) return all[i];        // prefer MetaMask when present
    }
    return all[0];
  }

  var state = { provider: null, account: null, chainId: null, label: null };
  var listeners = {};

  function emit(name, payload) {
    (listeners[name] || []).forEach(function (fn) { try { fn(payload); } catch (e) {} });
  }

  function on(name, fn) { (listeners[name] = listeners[name] || []).push(fn); }

  function available() { return !!pick(); }

  function req(method, params) {
    if (!state.provider) throw new Error('No wallet connected');
    return state.provider.request({ method: method, params: params || [] });
  }

  function bind(p) {
    if (!p || p.__sigilBound) return;
    p.__sigilBound = true;
    try {
      p.on('accountsChanged', function (accts) {
        state.account = (accts && accts[0]) ? accts[0].toLowerCase() : null;
        if (!state.account) { state.provider = null; try { localStorage.removeItem('sigil-mm-connected'); } catch (e) {} }
        emit('change', getState());
      });
      p.on('chainChanged', function (cid) {
        state.chainId = cid;
        emit('change', getState());
      });
    } catch (e) { /* some injected providers expose no .on — non-fatal */ }
  }

  function getState() {
    return {
      connected: !!state.account,
      account: state.account,
      chainId: state.chainId,
      onPolygon: state.chainId === POLYGON_PARAMS.chainId,
      label: state.label
    };
  }

  /** Connect (prompts MetaMask). Returns the new state. */
  async function connect() {
    var sel = pick();
    if (!sel) {
      var err = new Error('No browser wallet detected. Install MetaMask, then reload this page.');
      err.code = 'NO_PROVIDER';
      throw err;
    }
    state.provider = sel.provider;
    state.label = sel.info.name || 'Injected wallet';
    bind(state.provider);
    var accts = await req('eth_requestAccounts');
    if (!accts || !accts.length) throw new Error('No account was authorized.');
    state.account = accts[0].toLowerCase();
    try { state.chainId = await req('eth_chainId'); } catch (e) {}
    try { localStorage.setItem('sigil-mm-connected', '1'); } catch (e) {}
    emit('change', getState());
    return getState();
  }

  /**
   * Reconnect silently if the user already authorized this site in a previous
   * visit — eth_accounts never prompts, so this is safe to call on page load.
   */
  async function resume() {
    try { if (localStorage.getItem('sigil-mm-connected') !== '1') return getState(); } catch (e) { return getState(); }
    var sel = pick(); if (!sel) return getState();
    state.provider = sel.provider;
    state.label = sel.info.name || 'Injected wallet';
    bind(state.provider);
    try {
      var accts = await req('eth_accounts');
      if (accts && accts.length) {
        state.account = accts[0].toLowerCase();
        try { state.chainId = await req('eth_chainId'); } catch (e) {}
        emit('change', getState());
      } else {
        state.provider = null; state.account = null;
      }
    } catch (e) { state.provider = null; state.account = null; }
    return getState();
  }

  function disconnect() {
    // EIP-1193 has no revoke; this forgets the site's own connection state.
    state.provider = null; state.account = null; state.chainId = null; state.label = null;
    try { localStorage.removeItem('sigil-mm-connected'); } catch (e) {}
    emit('change', getState());
  }

  /**
   * Make sure MetaMask is on Polygon mainnet, adding the network if the user
   * doesn't have it yet. 4902 = "chain not added"; MetaMask also surfaces that
   * as -32603 wrapping 4902 in some versions, so both are handled.
   */
  async function ensurePolygon() {
    if (!state.provider) await connect();
    try { state.chainId = await req('eth_chainId'); } catch (e) {}
    if (state.chainId === POLYGON_PARAMS.chainId) return true;
    try {
      await req('wallet_switchEthereumChain', [{ chainId: POLYGON_PARAMS.chainId }]);
    } catch (e) {
      var code = e && (e.code != null ? e.code : (e.data && e.data.originalError && e.data.originalError.code));
      if (code === 4902 || code === -32603) {
        await req('wallet_addEthereumChain', [POLYGON_PARAMS]);   // adds AND switches
      } else {
        throw e;
      }
    }
    try { state.chainId = await req('eth_chainId'); } catch (e) {}
    emit('change', getState());
    return state.chainId === POLYGON_PARAMS.chainId;
  }

  /**
   * Ask MetaMask to display wrapped SIGIL in its asset list. Never fatal:
   * the user may simply decline, and the bridge works either way.
   */
  async function watchToken() {
    if (!state.provider) return false;
    try {
      return !!(await req('wallet_watchAsset', {
        type: 'ERC20',
        options: { address: TOKEN.address, symbol: TOKEN.symbol, decimals: TOKEN.decimals }
      }));
    } catch (e) { return false; }
  }

  /** connect -> Polygon -> offer the token, in one call. */
  async function connectFull() {
    var st = await connect();
    try { await ensurePolygon(); } catch (e) { /* user may decline the switch */ }
    try { await watchToken(); } catch (e) {}
    return getState();
  }

  async function signMessage(message) {
    if (!state.account) await connect();
    return await req('personal_sign', [message, state.account]);
  }

  // ── ABI helpers (hand-rolled: two static call shapes, no encoder needed) ──
  function pad32(hexNo0x) {
    var h = String(hexNo0x).replace(/^0x/, '').toLowerCase();
    if (h.length > 64) throw new Error('value too wide for uint256/bytes32');
    return '0'.repeat(64 - h.length) + h;
  }

  async function rawCall(to, data) {
    var body = { jsonrpc: '2.0', id: 1, method: 'eth_call', params: [{ to: to, data: data }, 'latest'] };
    if (state.provider) {
      try { return await req('eth_call', [{ to: to, data: data }, 'latest']); } catch (e) { /* fall through to public RPC */ }
    }
    var lastErr = null;
    for (var i = 0; i < PUBLIC_RPCS.length; i++) {
      try {
        var r = await fetch(PUBLIC_RPCS[i], {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body)
        });
        var j = await r.json();
        if (j && j.result) return j.result;
        lastErr = new Error((j && j.error && j.error.message) || 'RPC returned no result');
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('every Polygon RPC endpoint failed');
  }

  /** Wrapped-SIGIL balance of a Polygon address, as an 18dp wei BigInt. */
  async function balanceOfWei(addr) {
    var a = String(addr || '').toLowerCase().replace(/^0x/, '');
    if (!/^[0-9a-f]{40}$/.test(a)) throw new Error('not a valid Polygon address');
    var res = await rawCall(TOKEN.address, SEL_BALANCEOF + pad32(a));
    return BigInt(res || '0x0');
  }

  /**
   * Burn wrapped SIGIL on Polygon and instruct the bridge to release the same
   * amount of native SIGIL to `sigilAddr64hex`.
   *
   * @param amountBase8      BigInt, native SIGIL base units (8dp) — NOT wei.
   * @param sigilAddr64hex   the 64-hex SIGIL wallet address (bytes32).
   * @returns the Polygon transaction hash.
   *
   * THIS SPENDS REAL TOKENS AND IS NOT REVERSIBLE. Callers must confirm first.
   */
  async function burnToSigil(amountBase8, sigilAddr64hex) {
    if (!state.account) await connect();
    var ok = await ensurePolygon();
    if (!ok) throw new Error('MetaMask must be on Polygon mainnet to burn wrapped SIGIL.');

    var dest = String(sigilAddr64hex || '').toLowerCase().replace(/^0x/, '');
    if (!/^[0-9a-f]{64}$/.test(dest)) throw new Error('Destination must be a 64-hex SIGIL address.');

    var amt = BigInt(amountBase8);
    if (amt <= 0n) throw new Error('Amount must be greater than zero.');

    // 8dp -> 18dp. Because the caller is capped at 8 decimals this is always a
    // clean multiple of DECIMAL_SHIFT, so the relayer's flooring never bites.
    var wei = amt * DECIMAL_SHIFT;

    var bal = await balanceOfWei(state.account);
    if (bal < wei) throw new Error('Not enough wrapped SIGIL on Polygon — you hold ' + formatWei(bal) + '.');

    var data = SEL_BURN + pad32(wei.toString(16)) + pad32(dest);
    return await req('eth_sendTransaction', [{ from: state.account, to: TOKEN.address, data: data }]);
  }

  /** 18dp wei BigInt -> display string with 8dp (the native SIGIL precision). */
  function formatWei(wei) {
    var base = BigInt(wei) / DECIMAL_SHIFT;              // -> 8dp base units
    var whole = base / 100000000n;
    var frac = (base % 100000000n).toString().padStart(8, '0');
    return whole.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + frac;
  }

  /** "1.5" -> 150000000n (8dp base units). Rejects >8dp instead of rounding. */
  function parseAmount8(str) {
    var s = String(str || '').trim();
    if (!/^\d+(\.\d{1,8})?$/.test(s)) throw new Error('Amount must be a number with at most 8 decimals.');
    var p = s.split('.');
    return BigInt(p[0] || '0') * 100000000n + BigInt(((p[1] || '') + '00000000').slice(0, 8));
  }

  root.SigilMM = {
    POLYGON_PARAMS: POLYGON_PARAMS,
    TOKEN: TOKEN,
    DECIMAL_SHIFT: DECIMAL_SHIFT,
    available: available,
    list: list,
    connect: connect,
    connectFull: connectFull,
    resume: resume,
    disconnect: disconnect,
    ensurePolygon: ensurePolygon,
    watchToken: watchToken,
    signMessage: signMessage,
    balanceOfWei: balanceOfWei,
    burnToSigil: burnToSigil,
    formatWei: formatWei,
    parseAmount8: parseAmount8,
    getState: getState,
    on: on,
    explorerTx: function (h) { return 'https://polygonscan.com/tx/' + h; },
    explorerToken: function () { return 'https://polygonscan.com/token/' + TOKEN.address; }
  };
})(window);

    <script type="module">
      // Real wallet derivation — identical to the SIGIL React wallet's
      // keypairFromMnemonic:  priv = SHA3-256(mnemonic) ; pub = Ed25519(priv) ;
      // address = hex(pub) (64-hex). The node keys balances by this 64-hex.
      import { sha3_256 } from 'https://esm.sh/@noble/hashes@1.3.3/sha3';
      import { sha512 }   from 'https://esm.sh/@noble/hashes@1.3.3/sha512';
      import * as ed      from 'https://esm.sh/@noble/ed25519@2.1.0';
      ed.etc.sha512Sync = (...m) => sha512(ed.etc.concatBytes(...m));

      function deriveAddress(mnemonic){
        const priv = sha3_256(new TextEncoder().encode(mnemonic.trim()));
        const pub  = ed.getPublicKey(priv);
        return Array.from(pub, b => b.toString(16).padStart(2,'0')).join('');
      }

      window.generateMnemonic = function(){
        const words=[], pool=new Uint32Array(6);
        crypto.getRandomValues(pool);
        for(let i=0;i<6;i++) words.push(WL[pool[i]%WL.length]);
        const phrase = words.join(' ');
        document.getElementById('mnemonic').textContent = phrase;
        document.getElementById('seed').value = phrase;
      };

      // ── Create a SIGIL wallet from MetaMask (2026-08-26) ──────────────────
      // personal_sign is deterministic ECDSA (RFC 6979), so the same MetaMask
      // account always yields the same signature for this exact string, and so
      // the same SIGIL wallet — the account becomes a recovery path. The
      // signature is hashed into 6 words from the SAME list generateMnemonic()
      // uses, so the result is an ordinary SIGIL wallet (priv = SHA3-256(phrase),
      // pub = Ed25519(priv)) that the user can also write down.
      function mmMessage(account){
        return [
          'SIGILGRAPH wallet derivation v1','',
          'Signing this message derives your SIGIL wallet key.',
          'It is deterministic: this MetaMask account will always',
          'produce the same SIGIL wallet.','',
          'This is NOT a transaction and costs no gas.',
          'Only sign this on a site you trust.','',
          'Account: ' + account
        ].join('\n');
      }
      function mmStat(msg,color){
        var e=document.getElementById('mmStat');
        if(e){ e.textContent=msg||''; e.style.color=color||'#6df3ff'; }
      }
      function mmPhraseFromSignature(sig){
        const h = sha3_256(new TextEncoder().encode('sigil-mm-v1|' + sig.toLowerCase()));
        const words=[];
        for(let i=0;i<6;i++){
          const n = ((h[i*4]<<24)>>>0)+((h[i*4+1]<<16)>>>0)+((h[i*4+2]<<8)>>>0)+h[i*4+3];
          words.push(WL[n % WL.length]);
        }
        return words.join(' ');
      }
      window.createWalletMetaMask = async function(){
        if(!window.SigilMM){ mmStat('MetaMask helper failed to load — reload the page.','#ff8a8a'); return; }
        if(!window.SigilMM.available()){ mmStat('No browser wallet detected. Install MetaMask, then reload.','#ff8a8a'); return; }
        try{
          mmStat('Waiting for MetaMask…');
          const st = await window.SigilMM.connect();
          mmStat('Switching MetaMask to Polygon…');
          try{ await window.SigilMM.ensurePolygon(); }catch(e){}
          mmStat('Adding the wrapped SIGIL token…');
          try{ await window.SigilMM.watchToken(); }catch(e){}
          mmStat('Sign the message in MetaMask to derive your wallet…');
          const sig = await window.SigilMM.signMessage(mmMessage(st.account));
          if(!sig) throw new Error('MetaMask returned no signature.');
          const phrase = mmPhraseFromSignature(sig);
          const addr = deriveAddress(phrase);
          document.getElementById('mnemonic').textContent = phrase;
          document.getElementById('seed').value = phrase;
          try{ localStorage.setItem('sigil-mm-account', st.account); }catch(e){}
          mmStat('✓ Wallet '+addr.slice(0,10)+'…'+addr.slice(-6)+' derived. Write the 6 words down, then press ◈ Enter Sigilgraph.','#00e0c6');
        }catch(e){
          if(e && e.code===4001) mmStat('Cancelled in MetaMask.','#ff8a8a');
          else mmStat('MetaMask: '+((e&&e.message)||e),'#ff8a8a');
        }
      };

      window.go = function(){
        const seed = document.getElementById('seed').value.trim();
        if(!seed){ alert('Enter a seed phrase or generate one'); return; }
        let address;
        if(/^[0-9a-fA-F]{64}$/.test(seed)){
          address = seed.toLowerCase();              // already a raw address
        } else {
          try { address = deriveAddress(seed); }      // mnemonic → fresh wallet
          catch(e){ alert('Could not derive a wallet from that phrase: '+e); return; }
        }
        localStorage.setItem('sigil-wallet-seed', seed);
        localStorage.setItem('sigil-wallet-address', address);
        // LANE-N: tell the local node to MINE to this (keyed) wallet, so mined coins
        // land where [W] shows them — not the unspendable hostname-hash default.
        // Best-effort: only the embedded :9800 node serves /api/v1/use-wallet.
        try { fetch('/api/v1/use-wallet?address='+encodeURIComponent(address), {cache:'no-store'}); } catch(e){}
        window.location.href='sigil-wallet-tron.html';
      };

      // ── chain search from the gate (same as wallet/explorer; routes detail to the explorer) ──
      var _wT=null;
      function wSearch(){
        var q=((document.getElementById('wsearch')||{}).value||'').trim();
        var d=document.getElementById('wdrop');
        if(q.length<1){ if(d)d.style.display='none'; return; }
        clearTimeout(_wT); _wT=setTimeout(function(){ wRun(q); },200);
      }
      function wKey(e){ if(e.key==='Enter'){ wGo(); } else if(e.key==='Escape'){ var d=document.getElementById('wdrop'); if(d)d.style.display='none'; if(e.target&&e.target.blur)e.target.blur(); } }
      function wGo(){ var q=((document.getElementById('wsearch')||{}).value||'').trim(); if(q) location.href='/sigil-explorer.html?q='+encodeURIComponent(q); }
      async function wRun(q){
        var ql=q.toLowerCase(), pn={d:'delta',e:'epsilon',g:'gamma',b:'beta'}, rows=[];
        try{ var fr=await fetch('/sigil-recent-blocks.json?cb='+Date.now(),{cache:'no-store'}); var fj=await fr.json();
          (fj.results||[]).forEach(function(b){
            var hit = String(b.h).indexOf(q)===0 || (ql.length>=4&&b.hash&&b.hash.toLowerCase().indexOf(ql)>=0) || (ql.length>=3&&b.prod&&(pn[b.prod.toLowerCase()]||'').indexOf(ql)>=0);
            if(hit&&!rows.some(function(r){return r.h===b.h;})) rows.push({type:'live',h:b.h,t:'Block #'+b.h,d:'producer '+(pn[(b.prod||'').toLowerCase()]||b.prod||'?')+' · b3:'+(b.hash||'').slice(0,18)+'…',q:String(b.h)});
          });
        }catch(e){}
        try{ var sr=await fetch('/api/v1/search?q='+encodeURIComponent(q),{cache:'no-store'}); var sj=await sr.json();
          (sj.results||[]).forEach(function(x){ var m=String(x.title||'').match(/#?(\d+)/); var h=m?+m[1]:null;
            if(!rows.some(function(r){return r.h===h;})) rows.push({type:'flux',h:h,t:x.title||'result',d:(x.snippet||'').slice(0,58),q:(h!=null?String(h):q)});
          });
        }catch(e){}
        var d=document.getElementById('wdrop'); if(!d)return;
        rows=rows.slice(0,7);
        if(!rows.length){ d.innerHTML='<div class="wfoot">No live matches — press ↵ to search the full explorer</div>'; }
        else{ d.innerHTML=rows.map(function(r){ return '<div class="wr" onclick="location.href=\'/sigil-explorer.html?q='+encodeURIComponent(r.q)+'\'"><span class="wty '+r.type+'">'+r.type+'</span><span class="wt">'+r.t+'</span><span class="wd">'+(r.d||'')+'</span></div>'; }).join('')+'<div class="wfoot">↵ open in the SIGIL explorer</div>'; }
        d.style.display='block';
      }
      // this script is a module (own scope) — expose the handlers the inline attributes call,
      // exactly like `window.go` above.
      window.wSearch=wSearch; window.wKey=wKey; window.wGo=wGo; window.wRun=wRun;
      document.addEventListener('keydown',function(e){ if(e.key==='/'&&document.activeElement.id!=='wsearch'&&document.activeElement.id!=='seed'){ var s=document.getElementById('wsearch'); if(s){ e.preventDefault(); s.focus(); } } });
      document.addEventListener('click',function(e){ if(!e.target.closest('#wsearchWrap')){ var d=document.getElementById('wdrop'); if(d)d.style.display='none'; } });
    </script>
  </body>
</html>
