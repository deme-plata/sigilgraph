[package]
name = "sigil-narwhal-mempool"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Backward-compatible re-export shim over sigil-braidpool (the real crate, see SIGIL_BRAIDPOOL_v1_1.md §22). All BraidPool implementation work moved there; this crate keeps sigil-node/sigil-api/sigil-top's existing `sigil_narwhal_mempool::...` imports working unchanged. Also owns MempoolBackend (backend.rs) — the shared mempool handle sigil-node's producer loop and sigil-api's money API both hold."

[dependencies]
sigil-braidpool = { path = "../sigil-braidpool" }
sigil-tx        = { path = "../sigil-tx" }
sigil-state     = { path = "../sigil-state" }
