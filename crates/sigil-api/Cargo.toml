[package]
name = "sigil-api"
version.workspace = true
edition = "2021"

# The braid node's money API — a proper axum surface (the Quillon q-api-server
# pattern), annotated with flux-api's #[api] so OpenAPI + typed SDKs generate for
# free. Replaces the hand-rolled sigil-rpcd HTTP once it serves the full surface.

[dependencies]
axum = { version = "0.7", features = ["json", "query"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }
hex = "0.4"
blake3 = { workspace = true }

sigil-state = { path = "../sigil-state" }
sigil-tx = { path = "../sigil-tx" }
sigil-emission = { path = "../sigil-emission" }
# Backend-aware mempool handle (SIGIL_BRAIDPOOL_v1_1.md Phase B): AppState
# holds the SAME Arc<MempoolBackend> sigil-node's producer loop holds, so
# there is no seam where a real transaction submitted here could land in a
# mempool the producer never pulls from.
sigil-narwhal-mempool = { path = "../sigil-narwhal-mempool" }
# P1 mining-onto-the-braid: the reqwest-free verification core (Challenge /
# Submission / check_submission) — the same one gate sigil-rpcd uses, so every
# existing miner speaks to the braid unchanged.
# Declared by PATH, not `workspace = true`: the workspace entry does not set
# `default-features`, and cargo then IGNORES a per-crate `default-features =
# false` (it warns, then links the full default set — reqwest, ratatui, the
# lot). Inheriting here would silently pull an HTTP client and a TUI into the
# node's money API. The path form is the only one that actually holds the line.
flux-miner = { path = "../flux-miner", default-features = false }
flux-vdf = { workspace = true }

# flux-api: annotate handlers with #[api(...)] → OpenAPI 3.1 + TS/Py/Rust/Go SDKs.
flux-api = { path = "../../../flux/crates/flux-api" }
flux-api-macros = { path = "../../../flux/crates/flux-api-macros" }
inventory = "0.3"
