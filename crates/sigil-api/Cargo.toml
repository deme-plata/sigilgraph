[package]
name = "sigil-api"
version.workspace = true
edition = "2021"

# The braid node's money API — a proper axum surface (the Quillon q-api-server
# pattern), annotated with flux-api's #[api] so OpenAPI + typed SDKs generate for
# free. Replaces the hand-rolled sigil-rpcd HTTP once it serves the full surface.

[dependencies]
axum = { version = "0.7", features = ["json", "query"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }
hex = "0.4"
blake3 = { workspace = true }

sigil-state = { path = "../sigil-state" }
sigil-tx = { path = "../sigil-tx" }
# Door-level shielded-proof precheck (a DoS guard; the chokepoint is the authority).
sigil-shield = { path = "../sigil-shield" }
sigil-emission = { path = "../sigil-emission" }
# send.rs: SignedTx's sig-scheme wrapper types (SigScheme/SignatureBytes/
# PubKeyBytes) live here; sigil-tx doesn't re-export them.
sigil-header = { path = "../sigil-header" }
# send.rs: verifies the wallet's own ed25519 `sigil-rpc/v1` RPC-auth
# signature (the SAME scheme flux-miner's challenge/submit flow already
# trusts) — NOT SignedTx::verify_signature (that expects a signature over
# tx.hash(), which the lightweight wallet signer doesn't produce). Same
# version pin as sigil-tx/sigil-header to keep verifying keys byte-compatible.
# `rand_core` feature: only needed by this crate's own send.rs tests
# (SigningKey::generate); the live verify path (VerifyingKey::verify) doesn't
# need it, same as every other Ed25519Hot verifier in this workspace.
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
# eth.rs: read-only USDC balance lookups via a public Ethereum RPC (this
# box's own reth node is mid-sync — Execution stage far behind Headers, not
# yet usable for reads). This is the one deliberate exception to this crate's
# usual "no HTTP client" rule (see flux-miner's own comment below for why
# that rule exists) — `ureq` is a genuinely minimal, BLOCKING client (no
# async runtime, no default-feature bundle) used for exactly one occasional,
# low-volume, read-only outbound call, not a general HTTP stack.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Backend-aware mempool handle (SIGIL_BRAIDPOOL_v1_1.md Phase B): AppState
# holds the SAME Arc<MempoolBackend> sigil-node's producer loop holds, so
# there is no seam where a real transaction submitted here could land in a
# mempool the producer never pulls from.
sigil-narwhal-mempool = { path = "../sigil-narwhal-mempool" }
# P1 mining-onto-the-braid: the reqwest-free verification core (Challenge /
# Submission / check_submission) — the same one gate sigil-rpcd uses, so every
# existing miner speaks to the braid unchanged.
# Declared by PATH, not `workspace = true`: the workspace entry does not set
# `default-features`, and cargo then IGNORES a per-crate `default-features =
# false` (it warns, then links the full default set — reqwest, ratatui, the
# lot). Inheriting here would silently pull an HTTP client and a TUI into the
# node's money API. The path form is the only one that actually holds the line.
flux-miner = { path = "../flux-miner", default-features = false }
flux-vdf = { workspace = true }

# flux-api: annotate handlers with #[api(...)] → OpenAPI 3.1 + TS/Py/Rust/Go SDKs.
flux-api = { path = "../../../flux/crates/flux-api" }
flux-api-macros = { path = "../../../flux/crates/flux-api-macros" }
inventory = "0.3"

[dev-dependencies]
rand = { workspace = true }
