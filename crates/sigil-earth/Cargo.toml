[package]
name = "sigil-earth"
version.workspace = true
edition = "2021"
description = "Kristensen Earth Rotation Gauge K⊕ — IERS/GFZ ingest, 10-day forecast, JSON + SSE API, alerts and a signed daily attestation chain for sigilgraph.org"

[[bin]]
name = "sigil-earth"
path = "src/main.rs"

[dependencies]
# HTTP client for IERS / GFZ / the relay / the node — the house daemon client (sigil-oracle-feeder).
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { workspace = true }
serde_json = "1"
blake3 = "1"
hex = "0.4"
# Attestation signatures + Buzz identity — same primitives as sigil-api's nation.rs.
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
anyhow = "1"
# The /v1/earth API + SSE — same stack as sigil-api's /v1/events.
axum = { version = "0.7", features = ["json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false }
tower-http = { version = "0.5", features = ["cors"] }
# Public verification: SHA-256 beside BLAKE3 (browsers have SHA-256), and opening the anchor
# wallet's note ciphertexts with its PUBLISHED viewing key (sight, no authority).
sha2 = "0.10"
# The remote verifier must speak HTTP/2: the public edge returns empty bodies over HTTP/1.1 for the
# node's chunked routes (/v1/transactions, /v1/shielded/leaves). Same client sigil-top uses.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls-webpki-roots"] }
sigil-shield = { path = "../sigil-shield" }
flux-swarm-secret = { path = "../../../flux/crates/flux-swarm-secret" }
# `sigil-earth publish`: the attested bytes join the Flux data layer — the fluxc-mcp aether bundle
# store (same shard/encrypt primitives the nodes use), a local flux-db time series, a flux-search
# index. The nodes' own aether stores are reached over HTTP (sigil-api /v1/aether/*), no dep needed.
flux-aether = { path = "../../../flux/crates/flux-aether" }
flux-db = { path = "../../../flux/crates/flux-db" }
flux-search = { path = "../../../flux/crates/flux-search" }
