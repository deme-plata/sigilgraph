[package]
name = "sigil-header"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SIGIL block header v0 — schema-locked container for the 4 state roots, VDF, SQIsign nonce-magic, fluxc provenance, producer signature."

# Phase 0: defines the on-the-wire layout + serialization + content-addressed
# hash. Real cryptographic verification is delegated to dependencies that will
# land in later phases (flux-sqisign for nonce + sig, flux-vdf for Wesolowski,
# flux-zk-stark for state_transition_proof, flux-zk for fluxc artifact proof).

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
blake3     = { workspace = true }
hex        = { workspace = true }
thiserror  = { workspace = true }
# H1: producer-signature verification on block apply (height-gated, dormant by
# default). Ed25519Hot producers carry their pubkey as the 32-byte ValidatorId.
ed25519-dalek = { version = "2.2" }
# The header-page wire (`serve_read` codecs 0/1/5, the client decoders, the client block
# store) is positional bincode 1.3.3 — the SAME crate/version sigil-top encodes with, so
# the legacy-layout (`SigilBlockHeaderV0Legacy`) bytes are exactly what every deployed
# client wrote and read before the fifth root existed.
bincode = "1"

[dev-dependencies]
serde_json = { workspace = true }
