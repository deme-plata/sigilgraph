[package]
name = "sigil-wallet-phrase"
version = "0.1.0"
edition = "2021"
publish = false
description = "Recovery words (+ optional password) -> the 32-byte SIGIL wallet secret. One implementation for sigilgraph.org (wasm), sigil-top and the phone."

# NO crate-type here: the browser build applies cdylib for that build only
# (scripts/build-wallet-phrase-wasm.sh), the same rule as sigil-shield — a cdylib in the
# manifest drops the rlib's filename hash and invalidates every downstream build.

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hmac = "0.12"
sha2 = { workspace = true }
sha3 = { workspace = true }
unicode-normalization = "0.1"
zeroize = "1"

[dev-dependencies]
ed25519-dalek = "2.2"
hex = { workspace = true }
serde_json = "1"
