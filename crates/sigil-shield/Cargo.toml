[package]
name = "sigil-shield"
version = "0.1.0"
edition = "2021"
description = "SIGIL private transfers (P1): post-quantum shielded notes on LatticeGuard + lattice ring signatures, committed into the four state roots. See docs/SIGIL_PRIVACY_ARCHITECTURE_v0.md."

[dependencies]
flux-lattice-guard = { path = "../../../flux/crates/flux-lattice-guard" }
# Transparent, ceremony-free zk-STARK — no trusted setup (the reason it's the mainnet-
# safe validity engine). Real library, actually invoked (unlike Quillon's dead dep).
winterfell = "0.9"
blake3 = { workspace = true }
# Note ciphertexts: X25519 + BLAKE3-KDF + ChaCha20-Poly1305 sealed boxes, forward-secret
# per message. Explicitly NOT flux-kyberkem, whose own docs record that it returns
# all-zero shared secrets.
flux-swarm-secret = { path = "../../../flux/crates/flux-swarm-secret" }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }

# WASM build only: getrandom (pulled in transitively via `rand`) has no OS entropy
# source inside a browser sandbox and refuses to compile without an explicit backend.
# "js" wires it to the browser's own crypto.getRandomValues() — real entropy, not a
# stub. Native builds (Linux/Windows) are untouched; this table only applies under
# target_arch = "wasm32".
#
# wasm-bindgen (2026-08-25): the browser-callable skin over `wallet::build_spend` in
# `src/wasm_api.rs` (gated `#[cfg(target_arch = "wasm32")]` in lib.rs). Version left
# unpinned ("0.2") but MUST resolve to the same version the `wasm-bindgen` CLI tool is
# invoked with when generating JS glue — a mismatch hard-fails at that step, not at
# compile time. Pinned in practice by Cargo.lock (0.2.122 at the time this was added).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"

[lib]
# rlib ONLY. Do NOT add "cdylib" here, however tempting — it is what wasm-bindgen
# wants, but declaring it in the manifest costs the whole workspace its incremental
# builds. Reason: for a lib target whose crate-type list contains cdylib, cargo emits
# the artifact WITHOUT `-C extra-filename=<hash>` (a shared object needs a stable
# SONAME). sigil-shield then becomes the only crate in the tree writing to an unhashed
# `target/<profile>/deps/libsigil_shield.rlib`, so ALL of its units — every feature
# set, every profile, every concurrent agent — collide on that one path. Each build
# rewrites it, its mtime jumps, and cargo correctly marks every consumer stale:
#
#     sigil-state dirty: StaleDependency { name: "sigil_shield", dep_mtime > max_mtime }
#     -> sigil-emission/-events/-oracle/-braidpool -> sigil-api/-chronos -> sigil-node
#
# Measured 2026-08-26 with cdylib declared: a NO-OP `build -p sigil-node
# --profile release-fast` rebuilt ~15 crates and took 63s, then 107s on an identical
# immediately-following run — it could never converge. With rlib only: 1.1s.
# (Regression test: crates/sigil-shield/tests/no_cdylib_in_manifest.rs)
#
# The browser wallet still gets its .wasm — the cdylib is applied at BUILD time, not
# declared here, via `cargo rustc --crate-type cdylib`. See scripts/build-shield-wasm.sh,
# which is the only supported way to regenerate gui/wasm/.
crate-type = ["rlib"]

[features]
default = []
