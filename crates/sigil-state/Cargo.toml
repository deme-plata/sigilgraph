[package]
name = "sigil-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SIGIL state SMTs + the commit_state_transition chokepoint — the one place state writes are allowed. flux_ai_audit enforces this at MIR time."

# All write APIs are `pub(crate)`. External code can only mutate state by
# constructing a StateTransition and passing it through
# commit_state_transition(). That gives us a single auditable surface where
# we can attach a STARK proof, recompute the 4 roots, and gate writes on the
# pre-flight check.

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
blake3     = { workspace = true }
thiserror  = { workspace = true }

sigil-header = { path = "../sigil-header" }
# The chokepoint VERIFIES shielded-spend proofs itself rather than trusting a caller-
# supplied "already verified" flag. PV-0 (2026-08-19) found sigil-mixer's verify stub
# returning Ok(()) unconditionally, and the recorded danger was precisely that wiring it
# into this chokepoint would make a stub look like a passing verification. A direct
# dependency makes that unrepresentable: there is no injection point to stub.
sigil-shield = { path = "../sigil-shield" }

[dev-dependencies]
# shielded_end_to_end.rs drives a REAL prover through the chokepoint.
winterfell = "0.9"
# the node persists state with MessagePack; the round-trip test uses the same codec.
rmp-serde = "1"
# zz_snapshot_compat.rs: reshape an encoded snapshot to the PRE-shielded layout.
rmpv = "1"
serde_json = { workspace = true }
# stargate_500m.rs / sig_wall.rs / sig_agg.rs — measure the REAL wall
# (signature verification) next to state-commitment throughput.
ed25519-dalek = { version = "2.2", features = ["rand_core", "batch"] }
rand = "0.8"
flux-sqisign = { path = "../../../flux/crates/flux-sqisign" }
# sig_agg.rs — proof-carrying-block cost structure (O(1)-in-N verify).
flux-zk-stark = { path = "../../../flux/crates/flux-zk-stark" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# flux_vdf_lane.rs — the sequential VDF lane (Wesolowski repeated squaring).
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

# LANE-B (rocky-sync-B, SIGIL v3 sync sprint) — tests/decode_verify_bench.rs.
# The EXACT prod backfill-wire codec measured in isolation: server compresses a
# bincode(Vec<SigilBlockHeaderV0>) chunk with the C `zstd` crate (level 1); the
# follower decodes it with pure-Rust `ruzstd` (no C in the Windows cross-build),
# then bincode-deserializes + prechecks. We mirror that here to attribute the
# per-stage cost of the decode+verify lane against the 20k blk/s bar.
bincode = "1"
ruzstd  = "0.7"
zstd    = { workspace = true }
rayon   = { workspace = true }
hex     = { workspace = true }
