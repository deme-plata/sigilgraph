<!doctype html>
<!--
  sigil-shield WASM smoke test (2026-08-25).

  Not part of the product — a throwaway page to prove the wasm-pack/wasm-bindgen
  pipeline actually works (module loads, exports are callable, a real function
  returns a real answer) BEFORE touching the real wallet page. See the task notes
  in crates/sigil-shield/src/wasm_api.rs for what each export does.

  Open this file over HTTP (not file://) — ES module imports are blocked on the
  file: scheme by browsers. Any static file server rooted at gui/wasm/ works,
  e.g. `python3 -m http.server` from this directory.
-->
<html>
<head>
<meta charset="utf-8">
<title>sigil-shield wasm smoke test</title>
<style>
  body { background:#04080c; color:#cfe9f2; font-family: 'JetBrains Mono', monospace; padding: 24px; }
  h1 { color:#6df3ff; font-size: 16px; }
  .row { margin: 10px 0; padding: 10px; border: 1px solid rgba(33,212,253,.25); border-radius: 8px; }
  .ok { color:#00e0c6; }
  .bad { color:#ff8a8a; }
  pre { white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>sigil-shield wasm smoke test</h1>
<div id="out"></div>
<script type="module">
  const out = document.getElementById('out');
  function row(label, ok, detail) {
    const d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<b class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'PASS' : 'FAIL') + '</b> — ' + label +
      (detail ? '<pre>' + detail + '</pre>' : '');
    out.appendChild(d);
  }

  try {
    const mod = await import('./sigil_shield.js');
    row('module import', true);

    // wasm-bindgen --target web requires an explicit init() call before any
    // exported function is callable — it fetches + instantiates the .wasm
    // itself given no argument (relative to this module's own URL).
    await mod.default();
    row('wasm instantiated (init() resolved)', true);

    const version = mod.wasmApiVersion();
    row('wasmApiVersion()', version === 'sigil-shield-wasm-api/1', version);

    // A fixed, throwaway, all-zeros-except-one-byte seed — not a real wallet,
    // just deterministic input to prove the real prover math runs and is
    // reproducible (same seed -> same key, every time).
    const seedHex = '11'.repeat(32);
    const pk = mod.shieldPublicKey(seedHex);
    const pk2 = mod.shieldPublicKey(seedHex);
    row('shieldPublicKey() returns 64-hex', /^[0-9a-f]{64}$/.test(pk), pk);
    row('shieldPublicKey() is deterministic (same seed -> same key)', pk === pk2);

    const cm = mod.shieldNoteCommitment(seedHex, 0, '100');
    row('shieldNoteCommitment() returns 64-hex', /^[0-9a-f]{64}$/.test(cm), cm);

    // Real end-to-end proving smoke test: spend a single-note pool of just this
    // note (padded to a power-of-two pool of 2), paying a throwaway recipient.
    // This is the same code path the real wallet's private-send button calls —
    // if this proves+verifies+seals here, the pipeline itself is proven; the
    // real wallet-driven test (separate, against a live node) proves the
    // network round trip on top of it.
    const recipientSeedHex = '22'.repeat(32);
    // A throwaway X25519 pubkey is out of scope for this smoke test (needs the
    // real note_cipher key format) — this call is EXPECTED to fail at the
    // sealing step with a clear error, which itself proves error propagation
    // works correctly across the wasm boundary rather than silently returning
    // junk. The full real proving path is exercised by the two-wallet live
    // test, not here.
    try {
      mod.buildPrivateSend(
        seedHex, 0, '100', 0,
        JSON.stringify([cm]), 2,
        mod.shieldPublicKey(recipientSeedHex), 'not-a-real-x25519-key',
        '50'
      );
      row('buildPrivateSend() with a bad recipient enc key', false, 'expected an error, got a result');
    } catch (e) {
      row('buildPrivateSend() rejects a bad recipient key with a legible error (proves the real prover ran AND error propagation works)', true, String(e && e.message || e));
    }
  } catch (e) {
    row('unexpected failure', false, (e && e.stack) || String(e));
  }
</script>
</body>
</html>
