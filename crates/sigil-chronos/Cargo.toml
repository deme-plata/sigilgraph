[dependencies]
# chronos_scale: the 5TB storage-curve driver writes through the real store engine.
flux-db = { path = "../../../flux/crates/flux-db" }
rayon      = { workspace = true }
rand       = { workspace = true }
zstd       = { workspace = true }
lz4        = { workspace = true, optional = true }
bincode    = "1.3"
serde      = { workspace = true }
serde_json = { workspace = true }
blake3     = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow     = { workspace = true }
zk-flux            = { path = "../zk-flux" }
flux-lattice-guard = { path = "../../../flux/crates/flux-lattice-guard" }

flux-chronos = { path = "../../../flux/crates/flux-chronos" }
flux-p2p     = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sigil-header = { path = "../sigil-header" }
sigil-state  = { path = "../sigil-state" }
sigil-events = { path = "../sigil-events" }
sigil-tx     = { path = "../sigil-tx" }
# shielded_pool.rs: fill the pool to capacity and measure what real usage would cost.
sigil-shield = { path = "../sigil-shield" }
winterfell = "0.9"
sigil-bank   = { path = "../sigil-bank" }
sigil-tip-proof = { path = "../sigil-tip-proof" }
sigil-dagknight = { path = "../sigil-dagknight" }
# finality_gadget.rs: drives Phase 1 of SIGIL True Instant Finality
# (docs/research/SIGIL_INSTANT_FINALITY_v0.tex) — pure library code, zero
# consensus effect, see sigil-finality's own crate doc.
sigil-finality = { path = "../sigil-finality" }
# CHRONOS × BraidPool: the availability layer (sharded ingest, DRR scheduler,
# shard-bound acks, RS dissemination, repair) under the real sim + real p2p.
sigil-braidpool = { path = "../sigil-braidpool" }
# The REAL sync-state logic, driven by the deterministic sync scenarios.
sigil-sync = { path = "../sigil-sync" }
# The REAL local block-store height-index conflict logic (extracted from sigil-top,
# a binary-only crate, 2026-08-24) — closes wedge_writer_gap.rs's original gap.
sigil-block-store = { path = "../sigil-block-store" }
hex = { workspace = true }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
sigil-dex    = { path = "../sigil-dex" }
# Late-join catch-up: a fresh node verifies ONE constant-size fold proof of the
# history prefix (BLAKE4 transparent setup) instead of replaying every block.
flux-fold    = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# frontier_memo.rs (2026-08-25): drives sigil-node's REAL `dag_build_frontier` /
# `dag_build_frontier_memo` (crates/sigil-node/src/frontier.rs) + `mint_next_block` +
# `ChainTip`/`Braid` wiring, instead of re-modelling a copy. sigil-node ALREADY
# normal-depends on sigil-chronos (the chronos_sim/footprint bins), so a normal
# dependency the other way would be a cycle — this is a dev-dependency instead,
# which Cargo explicitly supports for exactly this shape: the `frontier_memo`
# test target links the normal (non-test) build of sigil-node's lib, which itself
# normal-depends on the normal (non-test) build of sigil-chronos's lib — two
# distinct, already-deduped units, no cycle. Because of this, `frontier_memo.rs`
# is declared `#[cfg(test)] mod frontier_memo;` in lib.rs and must NEVER be made
# reachable from a non-test build (that would turn this into a real cycle and fail
# to compile). sigil-api is needed alongside it for `dag_drain_apply`'s bridge
# params (SendBridge/BridgeBridge/DexBridge/UsdsBridge/UsdsBridgeBridge/
# ShieldedBridge) — it does not depend on sigil-chronos or sigil-node, so it is a
# perfectly ordinary dependency, dev-only here purely to match frontier_memo's
# test-only scope.
sigil-node = { path = "../sigil-node" }
sigil-api  = { path = "../sigil-api" }

[[bin]]
name = "chronos_virtual"
path = "src/bin/chronos_virtual.rs"

[[bin]]
name = "sigil-batchsweep"
path = "src/bin/sigil-batchsweep.rs"

[[bin]]
name = "sigil-braidpool-chronos"
path = "src/bin/sigil-braidpool-chronos.rs"

[[bin]]
name = "sigil-sync-chronos"
path = "src/bin/sigil-sync-chronos.rs"
